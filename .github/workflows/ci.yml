name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: easyboost_test
          POSTGRES_USER: easyboost_test
          POSTGRES_PASSWORD: integration_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyboost_test -d easyboost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://easyboost_test:integration_test_password@127.0.0.1:5432/easyboost_test
      TEST_DATABASE_URL: postgresql://easyboost_test:integration_test_password@127.0.0.1:5432/easyboost_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for secrets
        run: npm run security:secrets
      - name: Lint JavaScript
        run: npm run lint
      - run: npm run check
      - name: Build and verify frontend assets
        run: npm run build:frontend
      - name: Validate staging deployment
        run: |
          bash -n scripts/staging-deploy.sh scripts/staging-rollback.sh
          cp .env.staging.example .env.staging
          docker compose -f compose.staging.yml --env-file .env.staging config --quiet
      - run: npm run db:migrate
      - run: npm test
      - name: Chrome E2E
        run: npm run test:e2e
      - name: Validate AI quality tooling and engineering fixtures
        run: npm run quality:check
