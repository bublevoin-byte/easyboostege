name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for secrets
        run: npm run security:secrets
      - name: Scan Git history for secrets
        run: npm run security:history
      - name: Lint JavaScript
        run: npm run lint
      - run: npm run check
      - name: Validate staging deployment
        run: |
          bash -n scripts/staging-deploy.sh scripts/staging-rollback.sh
          cp .env.staging.example .env.staging
          docker compose -f compose.staging.yml --env-file .env.staging config --quiet
      - name: PostgreSQL repository integration
        run: npm run test:postgres
      # Сервер отдаёт dist/public, если сборка есть, и public/ иначе. Оба пути должны быть зелёными,
      # поэтому первый прогон идёт по исходникам, а всё, что после сборки, — по собранной версии,
      # то есть ровно по той, которая уезжает в production.
      - run: npm test
      - name: Chrome E2E on sources
        run: npm run test:e2e
      - name: Build and verify frontend assets
        run: npm run build:frontend
      - name: Chrome E2E on the build
        run: npm run test:e2e
      - name: Chrome Android E2E
        run: npm run test:e2e:android
      - name: Install Firefox and WebKit for Playwright
        run: npx playwright install --with-deps firefox webkit
      - name: Firefox E2E
        run: npm run test:e2e:firefox
      - name: iPhone WebKit E2E
        run: npm run test:e2e:iphone-webkit
      - name: Validate AI quality tooling and engineering fixtures
        run: npm run quality:check
