services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: easyboost_repository_test
      POSTGRES_USER: easyboost_repository_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1::5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyboost_repository_test -d easyboost_repository_test"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres-test-data:
