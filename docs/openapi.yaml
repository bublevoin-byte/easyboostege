                    type: { type: string, enum: [diagnosis_complete, explanation_complete, check_answer, transfer_answer] }
                    answer: { type: string, maxLength: 200 }
              additionalProperties: false
      responses:
        '200': { description: Server-validated state and next one-time nonce; a provider_call_id must match the outstanding call and authorizes exactly one strict accepted/state function output after the nonce transition; with current text_processing consent, text delivery also returns the next bounded AI turn, otherwise it atomically downgrades to the canonical local rule }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Invalid transition or replayed nonce }
        '503': { description: Voice delivery omitted or failed exact provider call correlation }
  /api/v1/voice-tutor/sessions/{sessionId}/fallback:
    post:
      summary: Continue the server-finalized proxy capsule in text or local mode without accepting client usage or wall-clock evidence
      description: The owner-serialized file mutation or PostgreSQL transaction first takes a fresh post-lock authority time, rechecks the whole active Base subscription and Premium entitlement, and for an exact pronunciation capsule locks and rebuilds its current attempt/ref/assistance/mastery/30-day-expiry evidence. Only a valid snapshot may finalize billing/status and rotate the fallback nonce.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string, minLength: 16, maxLength: 200 }
                reason: { type: string, enum: [microphone_unavailable, provider_unavailable, session_timeout], default: microphone_unavailable }
              additionalProperties: false
      responses:
        '200': { description: Same owner-locked capsule through the budgeted text AI operation when current text_processing consent exists, otherwise through its local canonical rule. A ticket not consumed by the proxy bills zero; a consumed abnormal proxy session retains its full reservation; a clean provider-confirmed session uses server-observed input plus output PCM bytes. No client time or second reservation is accepted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: The fresh owner-locked Base subscription or Premium voice_tutor entitlement is inactive; status, billing, outcome, delivery and nonce remain unchanged }
        '409': { description: Replayed nonce, session conflict, or the exact pronunciation attempt/ref/assistance/mastery/expiry evidence became stale; status, billing, outcome, delivery and nonce remain unchanged }
  /api/v1/voice-tutor/sessions/{sessionId}/clarifications:
