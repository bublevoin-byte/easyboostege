      description: Safe item projection that never exposes the answer key or skill mapping; both stay server-owned. Replayable local browser speech, listening choices without actual audio and Writing/Speaking recognition choices are assisted evidence, never independent mastery evidence. An identical server-owned skill/item family remains one strong observation across catalog versions.
