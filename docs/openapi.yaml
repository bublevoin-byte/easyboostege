        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockId, reason]
              properties:
                blockId: { type: string, pattern: '^asb_[0-9a-f]{16}_[0-9]{2}$' }
                reason: { type: string, enum: [too_difficult, too_easy, not_relevant, accessibility, excluded] }
              additionalProperties: false
      responses:
        '200': { description: Replacement or exclusion applied, or its exact response replayed, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveSessionReplacementResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Session or block does not belong to the authenticated learner }
        '409': { description: `ADAPTIVE_SESSION_REPLACEMENT_LOCKED` after execution has begun; otherwise the shared allowance was already used, no safe alternative exists, plan is unavailable, revision changed or the idempotency key conflicts }
  /api/v1/adaptive-learning/sessions/{sessionId}/start:
    parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
    post:
      summary: Atomically start the exact current learning block and issue a short-lived opaque execution claim
      description: The claim is owner/session/block/launch/revision-bound and expires after two hours. Its plaintext value is reconstructed by a domain-separated server HMAC for an exact Idempotency-Key replay, is never stored in a mutation snapshot or claim row, and is never exported. Another live unconsumed claim and a stale compare-and-set revision fail closed; an expired unconsumed claim may be replaced. The response snapshot session revision, replacement state and exact launch fingerprint are validated against the owner-locked session before the claim is written, so a concurrent replacement yields a coherent current launch or 409 and never an old response paired with a new claim. If a claim was already consumed by an exact persisted attempt but its advance response was lost, the 200 response returns that attempt for a durable exact advance and never issues a second claim. A Premium-depth block rechecks active base plus voice entitlement inside the same owner-serialized repository mutation using time captured only after file queue acquisition or PostgreSQL `FOR UPDATE` (`clock_timestamp()`), never the request timestamp.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockId, expectedRevision]
              properties:
                blockId: { type: string, pattern: '^asb_[0-9a-f]{16}_[0-9]{2}$' }
                expectedRevision: { type: integer, minimum: 0 }
              additionalProperties: false
      responses:
        '201': { description: Current block started and claim issued, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveSessionStartResult' } } } }
        '200': { description: Exact immutable start response replayed, or a consumed exact attempt returned for durable recovery without a new claim, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveSessionStartResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: ADAPTIVE_PREMIUM_REQUIRED after current Premium entitlement is rechecked for a deep Writing/Speaking block }
        '404': { description: Owner-bound session or block was not found }
        '409': { description: Stale revision, wrong/current state, active claim or idempotency conflict }
  /api/v1/adaptive-learning/sessions/{sessionId}/bind-attempt:
    parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
    post:
      summary: Bind a completed server-owned writing, speaking or day-1/day-7 repeat attempt to the active execution claim
      description: The browser supplies no score. The repository verifies owner, task/activity identity, completed status, creation after claim issuance and exact claim launch fingerprint. Repeat binding additionally verifies the exact owner recovery, repeat task, skill and module. Exact binding replay is safe. A Premium-depth block rechecks active base plus voice entitlement in the same owner-serialized mutation before consumed-claim replay or binding.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [executionClaim, attempt]
              properties:
                executionClaim: { type: string, minLength: 32, maxLength: 200, pattern: '^[A-Za-z0-9_-]+$' }
                attempt:
                  oneOf:
                    - type: object
                      required: [type, id]
                      properties:
                        type: { type: string, enum: [voice_tutor_repeat] }
                        id: { type: string, format: uuid }
                      additionalProperties: false
                    - type: object
                      required: [type, id]
                      properties:
                        type: { type: string, enum: [writing, speaking] }
                        id: { type: integer, minimum: 1 }
                      additionalProperties: false
              additionalProperties: false
      responses:
        '201': { description: Server-owned attempt bound to the claim, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } } }
        '200': { description: Exact binding replayed, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: ADAPTIVE_PREMIUM_REQUIRED after current Premium entitlement is rechecked for a deep Writing/Speaking block }
        '404': { description: Owner-bound session was not found }
        '409': { description: Invalid, consumed or mismatched claim/attempt }
        '410': { description: Execution claim expired }
  /api/v1/adaptive-learning/sessions/{sessionId}/advance:
    parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
    post:
      summary: Complete the exact current block from persisted evidence and recalculate the learner profile and plan
      description: Learning blocks require a claim-bound persisted module, writing, speaking or exact Voice Tutor day-1/day-7 repeat attempt. Breaks require null. The response contains an allowlisted evidence summary, profile/plan delta and next action; it never accepts a client-supplied completion or score. Compare-and-set and owner-global idempotency make concurrent/exact retries safe. A Premium-depth block rechecks active base plus voice entitlement inside the same owner-serialized replay or completion transaction.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blockId, expectedRevision, attempt]
              properties:
                blockId: { type: string, pattern: '^asb_[0-9a-f]{16}_[0-9]{2}$' }
                expectedRevision: { type: integer, minimum: 0 }
                attempt:
                  oneOf:
                    - type: object
                      required: [type, id]
                      properties:
                        type: { type: string, enum: [module, voice_tutor_repeat] }
                        id: { type: string, format: uuid }
                      additionalProperties: false
                    - type: object
                      required: [type, id]
                      properties:
                        type: { type: string, enum: [writing, speaking] }
                        id: { type: integer, minimum: 1 }
                      additionalProperties: false
                  nullable: true
              additionalProperties: false
      responses:
        '200': { description: Block completed or exact response replayed, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveSessionAdvanceResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: ADAPTIVE_PREMIUM_REQUIRED after current Premium entitlement is rechecked for a deep Writing/Speaking block }
        '404': { description: Owner-bound session or block was not found }
        '409': { description: Stale revision, wrong block/state, missing/mismatched attempt or idempotency conflict }
  /api/v1/adaptive-learning/sessions/{sessionId}/finish:
    parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
    post:
      summary: Explicitly finish a session only after every persisted block event exists
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 0 }
              additionalProperties: false
      responses:
        '200': { description: Completion summary created or exact finish response replayed, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveSessionFinishResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Owner-bound session was not found }
        '409': { description: Session is not ready, revision is stale or idempotency key conflicts }
  /api/v1/adaptive-learning/diagnostics/start:
    parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
    post:
      summary: Start or resume a bounded short or Premium deep diagnostic with a durable owner-bound replay claim
      description: Short is the default. New sessions use the immutable ege-short-diagnostic-v2 or Premium ege-deep-diagnostic-v2 catalog-policy; saved v1 sessions remain resumable under their original definitions. Deep requires current Premium throughout the run. A Free learner may complete one short diagnostic. A scheduled 28/35/42-day short refresh is offered through retention.rediagnostic.due but does not block ordinary learning sessions. Every resumed session uses its stored catalog version's policy. A successful key owns its exact start snapshot for the 24-hour start-claim retention window. New keys are bounded by a per-user hourly rate and by a finite live-claim budget.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                depth: { type: string, enum: [short, deep], default: short }
              additionalProperties: false
      responses:
        '201': { description: New diagnostic started, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveDiagnosticStartResult' } } } }
        '200': { description: Active run resumed, immutable claimed snapshot replayed within its retention window even after expiry/completion, or adequate existing evidence means no diagnostic is required, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveDiagnosticStartResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: ADAPTIVE_PREMIUM_REQUIRED for deep or ADAPTIVE_FREE_DIAGNOSTIC_USED after the one Free short diagnostic }
        '409': { description: Idempotency key conflict or the claimed stored catalog version is unsupported }
        '429': { description: New start keys exceeded the hourly DIAGNOSTIC_START_RATE_LIMIT or the finite retained-claim DIAGNOSTIC_START_LIMIT }
        '404': { description: Adaptive Learning rollout is disabled; the route is not registered }
  /api/v1/adaptive-learning/diagnostics/current:
    parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
    get:
      summary: Resume the latest current or expired diagnostic without exposing an answer key
      description: Both in-progress and ready states share the stored catalog policy's deadline (the v1 policy has a 20-minute deadline); at or after it the session is expired and cannot create evidence. The response projects maxItems, estimatedMinutes, deadlineMinutes and expiresAt from that stored policy for browser copy and progress.
      responses:
        '200': { description: Current diagnostic state or nulls when none is active, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveDiagnosticState' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: The stored diagnostic catalog version is unsupported; the server fails closed instead of applying a newer mapping }
        '404': { description: Adaptive Learning rollout is disabled; the route is not registered }
  /api/v1/adaptive-learning/diagnostics/{diagnosticId}/answers:
    parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
    post:
      summary: Idempotently answer the server-selected current diagnostic item
      description: Selection adapts privately from accepted responses using the stored catalog version's policy. Both in-progress and ready states share that policy's deadline (20 minutes for v1).
      parameters:
        - in: path
          name: diagnosticId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, choiceId]
              properties:
                itemId: { type: string, minLength: 1, maxLength: 100 }
                choiceId: { type: string, minLength: 1, maxLength: 20 }
              additionalProperties: false
      responses:
        '201': { description: Answer accepted and the next safe state returned, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } } }
        '200': { description: The exact originally observed answer snapshot is returned, even after later answers or completion, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Diagnostic does not belong to the authenticated learner }
        '409': { description: Item was already answered, is not current, time expired, the key conflicts, or the stored catalog version is unsupported }
  /api/v1/adaptive-learning/diagnostics/{diagnosticId}/complete:
    parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
    post:
      summary: Complete a ready diagnostic and return an explicitly preliminary profile result
      description: Ready does not pause time; ready sessions retain the stored policy deadline and cannot be completed after it. The first success atomically binds an allowlisted immutable completion response snapshot and preliminary profile to its idempotency key. Exact lost-response/concurrent retries replay it before any live profile calculation; a different completion key returns the same canonical snapshot without replacing the original claim.
      parameters:
        - in: path
          name: diagnosticId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 120 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '201': { description: Diagnostic completed and its immutable completion response snapshot returned, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveDiagnosticCompletionResult' } } } }
        '200': { description: Exact canonical completion snapshot replay returned without live profile recomputation, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AdaptiveDiagnosticCompletionResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Diagnostic does not belong to the authenticated learner }
        '409': { description: Diagnostic is not ready, time expired, the idempotency key conflicts, or the stored catalog version is unsupported }
  /api/v1/account/export:
    get:
      summary: Export the authenticated user's account, progress and attempt data
      responses:
        '200': { description: JSON export including adaptive goals/structured estimates/plan revisions/learning sessions/diagnostic sessions and bounded responses, Voice Tutor sessions, recovery/repeat outcomes, Speaking accent setup lifecycle metadata and bounded provider/model/prompt metadata; no accent evidence keys, raw audio, temporary captions, full Voice Tutor transcript, nonce hash, idempotency replay snapshots or answer key }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/account:
    delete:
      summary: Permanently delete the authenticated user and related data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation, owner]
              properties:
                confirmation: { type: string, enum: [DELETE] }
                owner: { type: string, minLength: 1, maxLength: 128, description: Intended local account owner captured before deletion; must exactly match the authenticated username. }
      responses:
        '200': { description: Account, Voice Tutor sessions/recoveries/repeats and pending/rejected rule reports are deleted; approved canonical cards survive without creator identity, and reviewer identity on retained cards is anonymized }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: OWNER_CHANGED; intended owner does not match the authenticated account and nothing is deleted }
  /api/v1/privacy/consent:
    get:
      summary: Read the user's text and realtime speech-to-speech processing choices and current policy version
      responses:
        '200': { description: Consent state and current policy version }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Grant or withdraw text and realtime speech-to-speech processing consent; an outdated policy version does not authorize a Voice Tutor connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text_processing, voice_processing]
              properties:
                text_processing: { type: boolean }
                voice_processing: { type: boolean }
      responses:
        '200': { description: Updated consent state }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/progress:
    get:
      summary: Read complete progress document
      parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
      responses:
        '200':
          description: Progress JSON object
          headers:
            X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: OWNER_CHANGED; intended owner does not match the authenticated account }
    post:
      summary: Replace progress document (legacy compatibility)
      parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Progress' }
      responses:
        '200':
          description: Saved
          headers:
            X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: OWNER_CHANGED; intended owner does not match the authenticated account }
  /api/v1/progress/modules:
    post:
      summary: Atomically merge changed top-level progress modules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, modules]
              properties:
                owner: { type: string, minLength: 1, maxLength: 128, description: Intended owner; must exactly match the authenticated username. }
                modules: { $ref: '#/components/schemas/Progress' }
      responses:
        '200': { description: Merged progress }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: OWNER_CHANGED; intended owner does not match the authenticated account }
  /api/v1/grammar/mastery-events:
    post:
      summary: Apply one owner-bound Grammar mastery event with server-authoritative time and revision CAS
      description: Client timestamps are outside the strict request schema and therefore ignored. Accepted events increment masteryRevision atomically; a stale expectedRevision returns a conflict with the current authoritative record, while a replayed durable event ID is reported separately without applying it twice.
      parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrammarMasteryEventRequest' }
      responses:
        '201':
          description: Event atomically applied and authoritative record returned
          headers:
            X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarMasteryEventResult' }
        '200':
          description: Stale or replayed event not applied; current authoritative record returned
          headers:
            X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarMasteryEventResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: OWNER_CHANGED; intended owner does not match the authenticated account }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/grammar/mastery-events/batch:
    post:
      summary: Apply one owner-bound atomic batch of Grammar mastery events
      description: Accepts one durable batchId and 1–20 unique durable event IDs under one authenticated owner transaction and one server clock sample. The intended owner must exactly match the authenticated username before repository mutation. If any unseen event conflicts, no unseen event in the batch is committed. Replays are reported separately and never applied twice.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrammarMasteryEventBatchRequest' }
      responses:
        '201':
          description: Every event atomically applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarMasteryEventBatchResult' }
        '200':
          description: Batch contained a replay or conflict; no conflicting unseen batch was partially committed. A conflict record is current authority. A stage-changing conflict must not be blindly retried or rebased; the client retains a bounded non-retryable marker until fresh evidence at the returned revision explicitly replaces it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrammarMasteryEventBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Intended queue owner no longer matches the authenticated account }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/reading/report:
    get:
      summary: Build the authenticated learner's deterministic Reading report
      description: Base is available with every active subscription. Expanded adds topic, CEFR, pace, repeat-error and time-allocation projections and requires a fresh server-side voice_tutor entitlement check. The response is derived from at most 120 persisted owner-bound completed canonical Reading rows; incomplete full sections, duplicates, legacy, generated and technical attempts are excluded. No learner answer, content, Voice payload or client entitlement is accepted or returned. The response is not cacheable.
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [base, expanded], default: base }
      responses:
        '200':
          description: Base or currently entitled expanded Reading report, with explicit evidence counts and confidence states
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: SUBSCRIPTION_REQUIRED or READING_PREMIUM_REQUIRED }
  /api/v1/module-attempts:
    post:
      summary: Record an idempotent learning-module result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, id, module, activity, score, maxScore]
              properties:
                owner: { type: string, minLength: 1, maxLength: 128, description: Intended owner; must exactly match the authenticated username. }
                id: { type: string, format: uuid }
                module:
                  type: string
                  enum: [grammar, vocabulary, reading, listening, exam]
                  description: Writing and speaking evidence is produced only by the existing server-assessed AI-review flows; this ordinary client endpoint rejects those modules with SERVER_ASSESSMENT_REQUIRED.
                activity:
                  type: string
                  maxLength: 80
                  description: vocabulary_active_recall_session uses the bounded per-mode summary metadata contract.
                score: { type: integer, minimum: 0 }
                maxScore: { type: integer, minimum: 1 }
                durationMs: { type: integer, minimum: 0, maximum: 14400000 }
                metadata:
                  type: object
                  description: For vocabulary_active_recall_session this is a strict flat summary with separate objective, guided and self-reported counters; raw words and answers are never accepted.
                  additionalProperties: true
      responses:
        '201': { description: Attempt created }
        '200': { description: Duplicate event accepted without creating another attempt }
        '400': { description: Invalid input, or SERVER_ASSESSMENT_REQUIRED for client-submitted writing/speaking evidence. }
        '409': { description: OWNER_CHANGED; intended owner does not match the authenticated account }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/word-progress:
    get:
      summary: List the authenticated learner's versioned vocabulary mastery
      parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
      responses:
        '200':
          description: Owner-scoped word mastery, including conservative legacy migration
          headers:
            X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' }
          content:
            application/json:
              schema:
                type: object
                required: [words]
                properties:
                  words:
                    type: array
                    items: { $ref: '#/components/schemas/WordMastery' }
                additionalProperties: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: OWNER_CHANGED; intended owner does not match the authenticated account }
    put:
      summary: Upsert a bounded batch of legacy SRS or versioned word-mastery states
      parameters:
      - $ref: '#/components/parameters/ExpectedOwner'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [words]
              properties:
                words:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    oneOf:
                      - { $ref: '#/components/schemas/LegacyWordProgress' }
                      - { $ref: '#/components/schemas/WordMastery' }
              additionalProperties: false
      responses:
        '200':
          description: Word states updated
          headers:
            X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: OWNER_CHANGED; intended owner does not match the authenticated account }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/error-bank:
    post:
      summary: Aggregate a bounded batch of learning errors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [errors]
              properties:
                errors:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [module, itemKey, errorType]
                    properties:
                      module: { type: string, enum: [grammar, vocabulary, reading, listening, writing, speaking, exam] }
                      itemKey: { type: string, maxLength: 160 }
                      errorType: { type: string, maxLength: 60 }
                      details: { type: object, additionalProperties: true }
      responses:
        '200': { description: Errors aggregated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/ai/evaluate-writing:
    post:
      summary: Evaluate EGE writing task 37 or 38
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskType, taskId, answer]
              properties:
                taskType: { type: string, enum: [writing_37, writing_38] }
                taskId: { type: string, maxLength: 120 }
                answer: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Validated review with explicit experimental assessment metadata
          content:
            application/json:
              schema:
                type: object
                required: [review, provider, attemptId, voiceTutor, assessment, evaluationScope]
                properties:
                  review: { type: object }
                  provider: { type: string, nullable: true }
                  attemptId: { type: integer }
                  voiceTutor:
                    type: object
                    required: [source, attemptId, revision, criterionChoices]
                    properties:
                      source: { type: string, enum: [writing] }
                      attemptId: { type: integer }
                      revision: { type: integer, enum: [1] }
                      criterionChoices:
                        type: array
                        items:
                          type: object
                          required: [index, label]
                          properties:
                            index: { type: integer, minimum: 0, maximum: 20 }
                            label: { type: string, minLength: 1, maxLength: 160 }
                          additionalProperties: false
                  assessment: { $ref: '#/components/schemas/ExperimentalAssessment' }
                  evaluationScope: { $ref: '#/components/schemas/WritingEvaluationScope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/ai/generate-content:
    post:
      summary: Generate validated educational content with a server-owned prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [operation, word]
                  properties:
                    operation: { type: string, enum: [dictionary_lookup] }
                    word: { type: string, minLength: 1, maxLength: 80 }
                  additionalProperties: false
                - type: object
                  required: [operation]
                  properties:
                    operation:
                      type: string
                      enum: [grammar_quiz, listening_dialog, reading_text, speaking_task_1, speaking_task_2, speaking_task_3, speaking_task_4, grammar_exam_19_24, reading_headings, reading_questions, reading_gaps, listening_matching, listening_true_false, listening_interview]
                  additionalProperties: false
                - type: object
                  required: [operation]
                  properties:
                    operation: { type: string, enum: [writing_task_37, writing_task_38] }
                    exclude:
                      type: array
                      maxItems: 200
                      items: { type: string, minLength: 1, maxLength: 200 }
                  additionalProperties: false
                - type: object
                  required: [operation, topicId, topic]
                  properties:
                    operation: { type: string, enum: [grammar_topic_set] }
                    topicId: { type: integer, minimum: 1, maximum: 20 }
                    topic: { type: string, minLength: 1, maxLength: 100 }
                  additionalProperties: false
                - type: object
                  required: [operation, count]
                  properties:
                    operation: { type: string, enum: [vocabulary_cards] }
                    count: { type: integer, minimum: 4, maximum: 8 }
                    exclude:
                      type: array
                      maxItems: 500
                      items: { type: string, minLength: 1, maxLength: 120 }
                  additionalProperties: false
      responses:
        '200': { description: Schema-validated content and prompt metadata }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/evaluate-speaking:
    post:
      summary: Extract bounded speaking facts and apply the versioned server-owned EGE combiner
      description: The browser identifies an owner-bound catalog session and never sends an assignment, transcript or rubric. Official task 1–4 requests include the exact finalized owner/session/item-bound Azure assessment key or keys; partial or context-mismatched evidence is rejected before xAI. Tasks 2–3 retain and validate each item duration instead of trusting only the aggregate. Azure pronunciation events receive an explicit owner and aligned transcript span; task-4 overlap with a semantic scoring span returns needs_retry rather than charging the same event twice. Identical requests are claimed by an owner-bound evaluation fingerprint and replay the canonical attempt without another provider call. Canonical replay and deterministic acoustic preflight run before AI budget and rate gates. A five-minute claim lease recovers interrupted pending work, and transient xAI failure resumes the same attempt with the existing Azure evidence. The server assembles the transcript, xAI receives it as untrusted data under a strict JSON Schema and returns semantic/language facts only; it cannot return a score or phonetic fact. The server applies the 1/4/5/10 combiner. Low confidence returns needs_retry with a null score and no Voice Tutor pointer. Adaptive Speaking composition for tasks 1–4 is enabled only through a fresh owner-bound session assigned after the adaptive execution claim. Until the offline calibration gate and exact external methodological approval pass, every result is labelled automatic_training, approximate and methodicallyValidated=false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [taskType, sessionId, pronunciationAssessmentKey]
                  properties:
                    taskType: { type: integer, enum: [1] }
                    sessionMode: { type: string, enum: [full_section] }
                    sessionId: { type: string, format: uuid }
                    pronunciationAssessmentKey: { type: string, format: uuid }
                  additionalProperties: false
                - type: object
                  required: [taskType, sessionId, pronunciationAssessmentKeys]
                  properties:
                    taskType: { type: integer, enum: [2] }
                    sessionMode: { type: string, enum: [full_section] }
                    sessionId: { type: string, format: uuid }
                    pronunciationAssessmentKeys:
                      type: array
                      minItems: 4
                      maxItems: 4
                      items: { type: string, format: uuid }
                  additionalProperties: false
                - type: object
                  required: [taskType, sessionId, pronunciationAssessmentKeys]
                  properties:
                    taskType: { type: integer, enum: [3] }
                    sessionMode: { type: string, enum: [full_section] }
                    sessionId: { type: string, format: uuid }
                    pronunciationAssessmentKeys:
                      type: array
                      minItems: 5
                      maxItems: 5
                      items: { type: string, format: uuid }
                  additionalProperties: false
                - type: object
                  required: [taskType, sessionId, pronunciationAssessmentKey]
                  properties:
                    taskType: { type: integer, enum: [4] }
                    sessionMode: { type: string, enum: [full_section] }
                    sessionId: { type: string, format: uuid }
                    pronunciationAssessmentKey: { type: string, format: uuid }
                  additionalProperties: false
      responses:
        '200':
          description: Deterministically scored review or a fail-closed needs_retry result
          content:
            application/json:
              schema:
                type: object
                required: [review, provider, promptVersion, attemptId, assessment]
                properties:
                  review: { $ref: '#/components/schemas/SpeakingAutomaticReview' }
                  provider: { type: string, nullable: true }
                  promptVersion: { type: string, enum: [speaking-semantic-v4] }
                  attemptId: { type: integer }
                  voiceTutor:
                    type: object
                    required: [source, attemptId, revision, criterionChoices]
                    properties:
                      source: { type: string, enum: [speaking] }
                      attemptId: { type: integer }
                      revision: { type: integer, enum: [1] }
                      criterionChoices:
                        type: array
                        items:
                          type: object
                          required: [index, label]
                          properties:
                            index: { type: integer, minimum: 0, maximum: 20 }
                            label: { type: string, minLength: 1, maxLength: 160 }
                          additionalProperties: false
                    additionalProperties: false
                  assessment: { $ref: '#/components/schemas/SpeakingAutomaticAssessment' }
                additionalProperties: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Owner-bound speaking session or assessment was not found }
        '409': { description: Catalog revision, assessment context or final-evidence state is incompatible, or the same evaluation is already in progress }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { description: Provider output failed the strict semantic facts contract and its single repair }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/ai/generate-speaking-sample:
    post:
      summary: Generate a validated model answer for speaking tasks 2-4
      responses:
        '200': { description: Schema-validated English model answer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/tts:
    get:
      summary: Generate or return cached speech audio
      parameters:
        - { in: query, name: text, required: true, schema: { type: string, maxLength: 500 } }
        - { in: query, name: voice, schema: { type: string } }
        - { in: query, name: slow, schema: { type: string, enum: ['0', '1'] } }
      responses:
        '200': { description: MPEG audio, content: { audio/mpeg: {} } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/stt:
    post:
      summary: Transcribe speech recording
      requestBody:
        required: true
        content:
          audio/webm:
            schema: { type: string, format: binary }
          audio/mp4:
            schema: { type: string, format: binary }
          audio/mpeg:
            schema: { type: string, format: binary }
          audio/ogg:
            schema: { type: string, format: binary }
          audio/wav:
            schema: { type: string, format: binary }
      responses:
        '200': { description: Transcript }
        '413': { description: Audio payload exceeds configured maximum }
        '415': { description: Unsupported audio MIME type }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  parameters:
    ExpectedOwner:
      in: header
      name: X-EasyBoost-Expected-Owner
      required: true
      description: Exact account captured before the request. Cookie-authenticated clients must send it; a mismatch fails closed with 409 OWNER_CHANGED before private data is read or mutated. Bearer integrations bind the same value through their Authorization identity.
      schema: { type: string, minLength: 1, maxLength: 64 }
  headers:
    X-EasyBoost-Response-Owner:
      required: true
      description: Exact authenticated account that owns this successful private response. The browser compares it with the pre-request owner incarnation before restoring, caching, or rendering private state.
      schema: { type: string, minLength: 1, maxLength: 64 }
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: eb_token
  schemas:
    SpeakingAccentProfile:
      type: object
      required: [locale, revision, source, effective_at, calibration_used]
      properties:
        locale: { type: string, enum: [en-GB, en-US] }
        revision: { type: integer, minimum: 1 }
        source: { type: string, enum: [manual, calibration] }
        effective_at: { type: string, format: date-time }
        calibration_used: { type: boolean }
      additionalProperties: false
    SpeakingAccentCalibrationPointer:
      type: object
      nullable: true
      required: [id, status, started_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
        started_at: { type: string, format: date-time }
      additionalProperties: false
    SpeakingAccentCalibrationExport:
      type: object
      nullable: true
      description: Owner-visible setup lifecycle metadata only. Internal assessment evidence keys are never exported.
      required: [id, status, started_at, completed_at, locale, confidence, policy_version]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed, cancelled] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        locale: { type: string, enum: [en-GB, en-US], nullable: true }
        confidence: { type: string, enum: [clear, close], nullable: true }
        policy_version: { type: string, enum: [speaking-accent-suggestion-v1], nullable: true }
      additionalProperties: false
    SpeakingAccentProfileState:
      type: object
      required: [profile, calibration, setupRequired]
      properties:
        profile:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/SpeakingAccentProfile' }]
        calibration: { $ref: '#/components/schemas/SpeakingAccentCalibrationPointer' }
        setupRequired: { type: boolean }
      additionalProperties: false
    SpeakingAccentProfileMutation:
      type: object
      required: [changed, profile]
      properties:
        changed: { type: boolean }
        profile: { $ref: '#/components/schemas/SpeakingAccentProfile' }
      additionalProperties: false
    SpeakingCalibrationConsent:
      type: object
      required: [granted, age_group, guardian_confirmed, policy_version, granted_at, revoked_at, updated_at]
      properties:
        granted: { type: boolean }
        age_group: { type: string, enum: [adult, minor] }
        guardian_confirmed: { type: boolean }
        policy_version: { type: string, enum: [speaking-calibration-consent-v1] }
        granted_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    SpeakingCalibrationSample:
      type: object
      description: Owner-visible metadata only. Audio, assessment key, expert identities, reviews and access audit are never returned here.
      required: [id, task_type, task_ref, accent_locale, status, created_at, expires_at, audio_retained, raw_deleted_at]
      properties:
        id: { type: string, format: uuid }
        task_type: { type: integer, minimum: 1, maximum: 4 }
        task_ref: { type: string, maxLength: 300 }
        accent_locale: { type: string, enum: [en-GB, en-US] }
        status: { type: string, enum: [awaiting_reviews, adjudication_pending, completed, consent_revoked, expired] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        audio_retained: { type: boolean }
        raw_deleted_at: { type: string, format: date-time, nullable: true }
      additionalProperties: false
    SpeakingCalibrationExpertCard:
      type: object
      description: No direct learner identifiers are exposed; there is no name, username, Telegram ID or VK ID.
      required: [sampleId, taskType, taskRef, task, rubric, accentLocale, maximumScore, reviewRound, expiresAt]
      properties:
        sampleId: { type: string, format: uuid }
        taskType: { type: integer, minimum: 1, maximum: 4 }
        taskRef: { type: string, maxLength: 300 }
        task: { type: object, description: Server-owned public task snapshot }
        rubric:
          type: object
          required: [version, maximumScore, criteria, sufficientDefinition]
          properties:
            version: { type: string, enum: [ege-speaking-expert-rubric-v1] }
            maximumScore: { type: integer, enum: [1, 4, 5, 10] }
            criteria: { type: array, minItems: 1, items: { type: string } }
            sufficientDefinition: { type: string }
          additionalProperties: false
        accentLocale: { type: string, enum: [en-GB, en-US] }
        maximumScore: { type: integer, enum: [1, 4, 5, 10] }
        reviewRound: { type: integer, minimum: 1, maximum: 12 }
        expiresAt: { type: string, format: date-time }
      additionalProperties: false
    SpeakingPronunciationQuota:
      type: object
      required: [tier, periodStart, limitSeconds, usedSeconds, heldSeconds, remainingSeconds]
      properties:
        tier: { type: string, enum: [base, premium] }
        periodStart: { type: string, format: date-time }
        limitSeconds: { type: integer, enum: [3600, 14400] }
        usedSeconds: { type: integer, minimum: 0, maximum: 14400 }
        heldSeconds: { type: integer, minimum: 0, maximum: 14400 }
        remainingSeconds: { type: integer, minimum: 0, maximum: 14400 }
      additionalProperties: false
    SpeakingPronunciationProviderStatus:
      type: object
      required: [available, provider, reason]
      properties:
        available: { type: boolean }
        provider: { type: string, enum: [azure-speech, fake-azure] }
        reason:
          type: string
          nullable: true
          enum: [provider_not_configured, sdk_not_installed, provider_unavailable, null]
      additionalProperties: false
    SpeakingPronunciationStatus:
      type: object
      required: [provider, quota]
      properties:
        provider: { $ref: '#/components/schemas/SpeakingPronunciationProviderStatus' }
        quota: { $ref: '#/components/schemas/SpeakingPronunciationQuota' }
      additionalProperties: false
    SpeakingPronunciationPhoneme:
      type: object
      required: [name, accuracyScore]
      description: For en-GB the acoustic score may be present while name remains null; IPA and candidates are en-US-only and omitted.
      properties:
        name: { type: string, nullable: true, maxLength: 24 }
        accuracyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
        ipa: { type: string, nullable: true, maxLength: 24 }
        candidates:
          type: array
          maxItems: 5
          items:
            type: object
            required: [name, score]
            properties:
              name: { type: string, maxLength: 24 }
              score: { type: number, nullable: true, minimum: 0, maximum: 100 }
            additionalProperties: false
      additionalProperties: false
    SpeakingPronunciationWord:
      type: object
      required: [text, offsetSeconds, durationSeconds, accuracyScore, errorType, phonemes]
      properties:
        text: { type: string, maxLength: 120 }
        offsetSeconds: { type: number, nullable: true, minimum: 0 }
        durationSeconds: { type: number, nullable: true, minimum: 0 }
        accuracyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
        errorType: { type: string, enum: [none, omission, insertion, mispronunciation, unexpected_break, missing_break, monotone, unknown] }
        phonemes:
          type: array
          maxItems: 24
          items: { $ref: '#/components/schemas/SpeakingPronunciationPhoneme' }
        syllables:
          description: en-US-only; omitted for en-GB.
          type: array
          maxItems: 16
          items:
            type: object
            required: [text, offsetSeconds, durationSeconds, accuracyScore]
            properties:
              text: { type: string, maxLength: 80 }
              offsetSeconds: { type: number, nullable: true, minimum: 0 }
              durationSeconds: { type: number, nullable: true, minimum: 0 }
              accuracyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
            additionalProperties: false
      additionalProperties: false
    SpeakingPronunciationAssessment:
      type: object
      required: [assessment, billing, quota]
      properties:
        assessment:
          type: object
          required: [status]
          properties:
            status:
              description: Incomplete, malformed, interrupted or detail-truncated provider evidence is fail-closed as low_quality and is never eligible for official mastery; partial is retained only for legacy stored responses.
              type: string
              enum: [success, low_quality, partial, timeout, unavailable, processing]
            isFinal:
              description: False only when provider recognition itself was interrupted; a detail-truncated settled result is partial and final.
              type: boolean
            provider: { type: string, enum: [azure-speech, fake-azure] }
            providerVersion: { type: string, maxLength: 80 }
            locale: { type: string, enum: [en-GB, en-US] }
            mode: { type: string, enum: [scripted, unscripted] }
            transcript: { type: string, maxLength: 10000 }
            processedDurationSeconds: { type: number, minimum: 0, maximum: 180 }
            confidence: { type: number, nullable: true, minimum: 0, maximum: 100 }
            overallScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
            accuracyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
            fluencyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
            completenessScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
            pauseAnalysisAvailable:
              type: boolean
              description: Explicit provider/locale capability. True for supported en-US assessments even when zero pause events were detected; false for unsupported locales such as en-GB.
            prosody:
              type: object
              required: [available, score]
              properties:
                available: { type: boolean }
                score: { type: number, nullable: true, minimum: 0, maximum: 100 }
                reason: { type: string, enum: [provider_pause_metric_unavailable, locale_not_supported] }
              additionalProperties: false
            words:
              type: array
              maxItems: 500
              items: { $ref: '#/components/schemas/SpeakingPronunciationWord' }
            quality:
              type: object
              required: [acceptable, warnings]
              properties:
                acceptable: { type: boolean }
                warnings: { type: array, maxItems: 12, items: { type: string, maxLength: 80 } }
              additionalProperties: false
            available: { type: boolean }
            reason: { type: string, maxLength: 80 }
            retryable: { type: boolean }
          additionalProperties: false
        billing:
          type: object
          required: [assessmentId, reservedSeconds, billableSeconds, conservative]
          properties:
            assessmentId: { type: string, format: uuid, nullable: true }
            reservedSeconds: { type: integer, minimum: 0, maximum: 180 }
            billableSeconds: { type: integer, minimum: 0, maximum: 180 }
            conservative: { type: boolean }
          additionalProperties: false
        quota: { $ref: '#/components/schemas/SpeakingPronunciationQuota' }
      additionalProperties: false
    SpeakingAdaptiveSkillId:
      type: string
      enum:
        - ege.speaking.reading_aloud
        - ege.speaking.direct_questions
        - ege.speaking.interview_completeness
        - ege.speaking.monologue_content
        - ege.speaking.monologue_organization
        - ege.speaking.spoken_grammar
        - ege.speaking.spoken_lexis
        - ege.speaking.fluency
        - ege.speaking.pronunciation_words
        - ege.speaking.pronunciation_phonemes
        - ege.speaking.signal_quality
    SpeakingTargetedPracticeRequest:
      type: object
      required: [sourceAttemptId, reportRevision, accentLocale, skillId, contentRef]
      properties:
        sourceAttemptId: { type: integer, minimum: 1 }
        reportRevision: { type: string, pattern: '^attempt\.[0-9]+\.[0-9]+$', maxLength: 80 }
        accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
        skillId: { $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }
        contentRef:
          type: string
          maxLength: 320
          pattern: '^server:speaking:task:[1-4](?::skill:[a-z0-9._-]{3,120})?(?::focus:[a-z0-9._-]{3,120})?:new:v1$'
      additionalProperties: false
    SpeakingPronunciationFocus:
      type: object
      required: [kind, value, anchorWord, ref]
      properties:
        kind: { type: string, enum: [word, phoneme] }
        value: { type: string, minLength: 1, maxLength: 120 }
        anchorWord: { type: string, minLength: 1, maxLength: 120 }
        ref: { type: string, pattern: '^(?:word|phoneme)\.[1-9][0-9]*\.[0-9]+(?:\.[0-9]+)?$', maxLength: 120 }
      additionalProperties: false
    SpeakingAssignedTargetedPractice:
      type: object
      required: [sourceAttemptId, reportRevision, accentLocale, skillId, label, contentRef, focus]
      properties:
        sourceAttemptId: { type: integer, minimum: 1 }
        reportRevision: { type: string, nullable: true, pattern: '^attempt\.[0-9]+\.[0-9]+$', maxLength: 80 }
        accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
        skillId: { $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }
        label: { type: string, minLength: 1, maxLength: 160 }
        contentRef: { type: string, minLength: 20, maxLength: 320 }
        focus:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/SpeakingPronunciationFocus' }]
      additionalProperties: false
    SpeakingTargetOutcome:
      type: object
      required: [sourceAttemptId, evaluatedAttemptId, reportRevision, accentLocale, skillId, focus, status, score, maxScore]
      properties:
        sourceAttemptId: { type: integer, minimum: 1 }
        evaluatedAttemptId: { type: integer, minimum: 1 }
        reportRevision: { type: string, nullable: true, pattern: '^attempt\.[0-9]+\.[0-9]+$', maxLength: 80 }
        accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
        skillId: { $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }
        focus:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/SpeakingPronunciationFocus' }]
        status: { type: string, enum: [resolved, still_needs_work, inconclusive] }
        score: { type: number, nullable: true, minimum: 0, maximum: 100 }
        maxScore: { type: integer, enum: [100] }
      additionalProperties: false
    SpeakingLearningMaterial:
      type: object
      required: [catalogId, catalogRevision, taskRef, taskRevision, cefr, topic]
      properties:
        catalogId: { type: string, maxLength: 80 }
        catalogRevision: { type: integer, minimum: 1 }
        taskRef: { type: string, maxLength: 160 }
        taskRevision: { type: integer, minimum: 1 }
        cefr: { type: string, maxLength: 12 }
        topic: { type: string, maxLength: 160 }
      additionalProperties: false
    SpeakingLearningCriterion:
      type: object
      required: [id, skillIds, name, score, maxScore, masteryEligible]
      properties:
        id: { type: string, pattern: '^task[1-4]\.criterion\.[1-9][0-9]*$' }
        skillIds:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }
        name: { type: string, maxLength: 160 }
        score: { type: number, minimum: 0, maximum: 10 }
        maxScore: { type: number, minimum: 1, maximum: 10 }
        masteryEligible: { type: boolean }
      additionalProperties: false
    SpeakingLanguageDiagnostic:
      type: object
      required: [skillId, name, score, maxScore, basis, masteryEligible]
      properties:
        skillId: { type: string, enum: [ege.speaking.spoken_grammar, ege.speaking.spoken_lexis] }
        name: { type: string, maxLength: 160 }
        score: { type: number, minimum: 0, maximum: 100 }
        maxScore: { type: number, enum: [100] }
        basis: { type: string, enum: [full_official_language_criterion_without_validated_errors, official_language_score_with_validated_error_kind] }
        masteryEligible: { type: boolean }
      additionalProperties: false
    SpeakingLearningWordIssue:
      type: object
      required: [id, word, errorType, itemIndex, accuracyScore, gross, phonemes]
      properties:
        id: { type: string, maxLength: 160 }
        word: { type: string, maxLength: 120 }
        errorType: { type: string, maxLength: 80 }
        itemIndex: { type: integer, nullable: true, minimum: 1, maximum: 5 }
        accuracyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
        gross: { type: boolean, nullable: true }
        offsetSeconds: { type: number, minimum: 0, maximum: 180, description: Provider-owned offset within the item recording; omitted for legacy evidence without timing. }
        durationSeconds: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 180, description: Provider-owned word duration paired with offsetSeconds. }
        phonemes:
          type: array
          maxItems: 20
          items:
            type: object
            required: [label, accuracyScore]
            properties:
              label: { type: string, maxLength: 20 }
              accuracyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
            additionalProperties: false
      additionalProperties: false
    SpeakingLearningSignal:
      type: object
      required: [quality, semanticConfidence, acousticConfidence, highConfidence]
      properties:
        quality: { type: string, enum: [good, acceptable, poor] }
        semanticConfidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
        acousticConfidence: { type: number, nullable: true, minimum: 0, maximum: 1 }
        highConfidence: { type: boolean }
        recordingDurationSeconds: { type: number, minimum: 0, maximum: 200 }
        completenessScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
        fluencyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
        wordAccuracyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
        phonemeAccuracyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
        itemDurations:
          type: array
          maxItems: 5
          items:
            type: object
            required: [itemIndex, durationSeconds]
            properties:
              itemIndex: { type: integer, minimum: 1, maximum: 5 }
              durationSeconds: { type: number, minimum: 0, maximum: 180 }
            additionalProperties: false
        pauseAnalysis:
          type: object
          required: [available, reason, fluencyProxyAvailable, totalCount, unexpectedBreakCount, missingBreakCount, events]
          properties:
            available: { type: boolean }
            reason: { type: string, nullable: true, enum: [provider_pause_metric_unavailable, locale_not_supported] }
            fluencyProxyAvailable: { type: boolean }
            totalCount: { type: integer, minimum: 0, maximum: 120 }
            unexpectedBreakCount: { type: integer, minimum: 0, maximum: 120 }
            missingBreakCount: { type: integer, minimum: 0, maximum: 120 }
            events:
              type: array
              maxItems: 120
              items:
                type: object
                required: [id, type, itemIndex, word]
                properties:
                  id: { type: string, maxLength: 160 }
                  type: { type: string, enum: [unexpected_break, missing_break] }
                  itemIndex: { type: integer, nullable: true, minimum: 1, maximum: 5 }
                  word: { type: string, nullable: true, maxLength: 120 }
                  offsetSeconds: { type: number, minimum: 0, maximum: 180 }
                  durationSeconds: { type: number, exclusiveMinimum: true, maximum: 180 }
                additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    SpeakingLearningAttempt:
      type: object
      required: [version, attemptId, taskType, taskRef, sessionId, taskRevision, accentLocale, material, targetedPractice, targetOutcome, status, score, maxScore, transcript, verdict, criteria, languageDiagnostics, wordIssues, signal, provenance, masteryEligible, observedAt]
      properties:
        version: { type: string, enum: [speaking-learning-evidence-v1] }
        attemptId: { type: integer, minimum: 1 }
        taskType: { type: integer, enum: [1, 2, 3, 4] }
        taskRef: { type: string, nullable: true, maxLength: 160 }
        sessionId: { type: string, nullable: true, maxLength: 80 }
        taskRevision: { type: integer, nullable: true, minimum: 1 }
        accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
        material:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpeakingLearningMaterial'
        targetedPractice:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/SpeakingAssignedTargetedPractice' }]
        targetOutcome:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/SpeakingTargetOutcome' }]
        status: { type: string, enum: [scored, needs_retry] }
        score: { type: number, nullable: true, minimum: 0, maximum: 10 }
        maxScore: { type: integer, enum: [1, 4, 5, 10] }
        transcript: { type: string, maxLength: 8000 }
        verdict: { type: string, maxLength: 1000 }
        criteria:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/SpeakingLearningCriterion' }
        languageDiagnostics:
          type: array
          maxItems: 2
          items: { $ref: '#/components/schemas/SpeakingLanguageDiagnostic' }
        strengths: { type: array, maxItems: 20, items: { type: string, maxLength: 600 } }
        improvements:
          type: array
          maxItems: 20
          items:
            type: object
            required: [wrong, right, note]
            properties:
              wrong: { type: string, maxLength: 300 }
              right: { type: string, maxLength: 300 }
              note: { type: string, maxLength: 600 }
            additionalProperties: false
        wordIssues:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/SpeakingLearningWordIssue' }
        signal: { $ref: '#/components/schemas/SpeakingLearningSignal' }
        provenance:
          type: object
          required: [officialSession, assistance]
          properties:
            officialSession: { type: boolean }
            assistance: { type: string, enum: [unassisted, assisted] }
          additionalProperties: false
        masteryEligible: { type: boolean }
        observedAt: { type: string, format: date-time, nullable: true }
      additionalProperties: false
    SpeakingLearningReport:
      type: object
      required: [version, reportRevision, activeAccentLocale, assessment, access, currentAttempt, attemptTimeline, nextStep, premium]
      properties:
        version: { type: string, enum: [speaking-learning-report-v1] }
        reportRevision: { type: string, pattern: '^(?:empty\.0|attempt\.[0-9]+\.[0-9]+)$', maxLength: 80 }
        activeAccentLocale:
          description: Canonical pronunciation profile used to scope Premium targets, dynamics, comparison and time allocation.
          type: string
          nullable: true
          enum: [en-GB, en-US]
        assessment:
          type: object
          required: [mode, approximate, methodicallyValidated]
          properties:
            mode: { type: string, enum: [automatic_training] }
            approximate: { type: boolean, enum: [true] }
            methodicallyValidated: { type: boolean, enum: [false] }
          additionalProperties: false
        access:
          type: object
          required: [tier, limitSeconds, usedSeconds, remainingSeconds]
          properties:
            tier: { type: string, enum: [base, premium] }
            limitSeconds: { type: integer, enum: [3600, 14400] }
            usedSeconds: { type: integer, minimum: 0 }
            remainingSeconds: { type: integer, minimum: 0 }
          additionalProperties: false
        currentAttempt:
          description: Bounded revalidated official analysis. Technical and assisted attempts are visible with masteryEligible=false.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpeakingLearningAttempt'
        attemptTimeline:
          description: Bounded Base and Premium history. Assisted and technical attempts remain visible but declare masteryEligible=false.
          type: array
          maxItems: 120
          items:
            type: object
            required: [attemptId, taskType, status, score, maxScore, masteryEligible, observedAt]
            properties:
              attemptId: { type: integer, minimum: 1 }
              taskType: { type: integer, enum: [1, 2, 3, 4] }
              status: { type: string, enum: [scored, needs_retry] }
              score: { type: number, nullable: true, minimum: 0, maximum: 10 }
              maxScore: { type: integer, enum: [1, 4, 5, 10] }
              masteryEligible: { type: boolean }
              observedAt: { type: string, format: date-time, nullable: true }
            additionalProperties: false
        nextStep:
          type: object
          required: [skillId, label, taskType, focus, reason]
          properties:
            skillId:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }]
            label: { type: string, maxLength: 160 }
            taskType: { type: integer, enum: [1, 2, 3, 4] }
            focus:
              nullable: true
              allOf: [{ $ref: '#/components/schemas/SpeakingPronunciationFocus' }]
            reason: { type: string, enum: [weakest_observed_criterion, weakest_pronunciation_target, focus_material_unavailable, start_official_attempt, retry_without_assistance, retry_for_signal_quality, retry_technical_assessment, continue_official_practice] }
          additionalProperties: false
        premium:
          description: Null for Base; bounded longitudinal and transfer-practice tools for Premium, scoped to activeAccentLocale when the canonical profile exists. It never rewrites currentAttempt.
          type: object
          nullable: true
          required: [trend, comparison, criterionDynamics, wordDynamics, phonemeDynamics, fluencyDynamics, pauseDynamics, targetedPractice, unavailableTargets, targetOutcomes, voiceTutor, timeAllocationRecommendation, personalSummary]
          properties:
            trend:
              type: array
              maxItems: 120
              items:
                type: object
                required: [attemptId, taskType, score, maxScore, observedAt, accentLocale, basis]
                properties:
                  attemptId: { type: integer, minimum: 1 }
                  taskType: { type: integer, enum: [1, 2, 3, 4] }
                  score: { type: number, minimum: 0, maximum: 10 }
                  maxScore: { type: integer, enum: [1, 4, 5, 10] }
                  observedAt: { type: string, format: date-time, nullable: true }
                  accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                  basis: { type: string, enum: [accent_locale] }
                additionalProperties: false
            comparison:
              type: object
              nullable: true
              required: [currentAttemptId, previousAttemptId, scoreDelta, accentLocale, basis]
              properties:
                currentAttemptId: { type: integer, minimum: 1 }
                previousAttemptId: { type: integer, nullable: true, minimum: 1 }
                scoreDelta: { type: integer, nullable: true, minimum: -100, maximum: 100 }
                accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                basis: { type: string, enum: [same_accent_locale_task_type_and_cefr] }
              additionalProperties: false
            criterionDynamics:
              type: array
              maxItems: 22
              items:
                type: object
                required: [skillId, accentLocale, basis, points]
                properties:
                  skillId: { $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }
                  accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                  basis: { type: string, enum: [same_accent_locale] }
                  points:
                    type: array
                    maxItems: 120
                    items:
                      type: object
                      required: [attemptId, score, maxScore, observedAt, accentLocale]
                      properties:
                        attemptId: { type: integer, minimum: 1 }
                        score: { type: number, minimum: 0, maximum: 100 }
                        maxScore: { type: number, minimum: 1, maximum: 100 }
                        observedAt: { type: string, format: date-time, nullable: true }
                        accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                      additionalProperties: false
                additionalProperties: false
            wordDynamics: { $ref: '#/components/schemas/SpeakingIssueDynamics' }
            phonemeDynamics: { $ref: '#/components/schemas/SpeakingIssueDynamics' }
            fluencyDynamics:
              type: array
              maxItems: 120
              items:
                type: object
                required: [attemptId, observedAt, fluencyScore, completenessScore, signalQuality, accentLocale, basis]
                properties:
                  attemptId: { type: integer, minimum: 1 }
                  observedAt: { type: string, format: date-time, nullable: true }
                  fluencyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
                  completenessScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
                  signalQuality: { type: string, enum: [good, acceptable, poor] }
                  accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                  basis: { type: string, enum: [accent_locale] }
                additionalProperties: false
            pauseDynamics:
              type: array
              maxItems: 120
              items:
                type: object
                required: [attemptId, observedAt, available, reason, fluencyScore, totalCount, unexpectedBreakCount, missingBreakCount, accentLocale, basis]
                properties:
                  attemptId: { type: integer, minimum: 1 }
                  observedAt: { type: string, format: date-time, nullable: true }
                  available: { type: boolean }
                  reason: { type: string, nullable: true, enum: [provider_pause_metric_unavailable, locale_not_supported] }
                  fluencyScore: { type: number, nullable: true, minimum: 0, maximum: 100 }
                  totalCount: { type: integer, minimum: 0, maximum: 120 }
                  unexpectedBreakCount: { type: integer, minimum: 0, maximum: 120 }
                  missingBreakCount: { type: integer, minimum: 0, maximum: 120 }
                  accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                  basis: { type: string, enum: [accent_locale] }
                additionalProperties: false
            targetedPractice:
              type: object
              nullable: true
              required: [skillId, label, taskType, materialPolicy, sourceAttemptId, reportRevision, accentLocale, excludeTaskRef, cefr, focus, contentRef, suitableTaskRefs]
              properties:
                skillId: { $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }
                label: { type: string, maxLength: 160 }
                taskType: { type: integer, enum: [1, 2, 3, 4] }
                materialPolicy: { type: string, enum: [different_server_owned_material] }
                sourceAttemptId: { type: integer, minimum: 1 }
                reportRevision: { type: string, pattern: '^attempt\.[0-9]+\.[0-9]+$', maxLength: 80 }
                accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                excludeTaskRef: { type: string, maxLength: 160 }
                cefr: { type: string, nullable: true, maxLength: 12 }
                focus:
                  nullable: true
                  allOf: [{ $ref: '#/components/schemas/SpeakingPronunciationFocus' }]
                contentRef:
                  type: string
                  maxLength: 320
                  pattern: '^server:speaking:task:[1-4](?::skill:[a-z0-9._-]{3,120})?(?::focus:[a-z0-9._-]{3,120})?:new:v1$'
                suitableTaskRefs:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string, maxLength: 160 }
              additionalProperties: false
            unavailableTargets:
              type: array
              maxItems: 20
              items:
                type: object
                required: [skillId, label, taskType, sourceAttemptId, accentLocale, focus, reason]
                properties:
                  skillId: { $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }
                  label: { type: string, maxLength: 160 }
                  taskType: { type: integer, enum: [1, 2, 3, 4] }
                  sourceAttemptId: { type: integer, minimum: 1 }
                  accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                  focus: { $ref: '#/components/schemas/SpeakingPronunciationFocus' }
                  reason: { type: string, enum: [no_server_owned_focus_material] }
                additionalProperties: false
            targetOutcomes:
              type: array
              maxItems: 30
              items: { $ref: '#/components/schemas/SpeakingTargetOutcome' }
            voiceTutor:
              type: object
              nullable: true
              required: [source, attemptId, revision, attemptSummary]
              oneOf:
                - required: [criterion]
                - required: [pronunciationError]
              properties:
                source: { type: string, enum: [speaking] }
                attemptId: { type: integer, minimum: 1 }
                revision: { type: integer, enum: [1] }
                criterion:
                  type: object
                  required: [index, ref, label, score, maxScore]
                  properties:
                    index: { type: integer, minimum: 0, maximum: 4 }
                    ref: { type: string, pattern: '^task[1-4]\.criterion\.[1-9][0-9]*$', maxLength: 120 }
                    label: { type: string, maxLength: 160 }
                    score: { type: number, minimum: 0, maximum: 10 }
                    maxScore: { type: number, minimum: 1, maximum: 10 }
                  additionalProperties: false
                pronunciationError:
                  type: object
                  required: [ref, kind, label, word, phoneme, accuracyScore, expectedMinimum, observedAt, accentLocale, expiresAt]
                  properties:
                    ref:
                      type: string
                      maxLength: 120
                      pattern: '^(?:word|phoneme)\.[0-9]+\.[0-9]+(?:\.[0-9]+)?$'
                    kind: { type: string, enum: [word, phoneme] }
                    label: { type: string, minLength: 1, maxLength: 160 }
                    word: { type: string, minLength: 1, maxLength: 120 }
                    phoneme: { type: string, nullable: true, maxLength: 20 }
                    accuracyScore: { type: number, minimum: 0, maximum: 80, exclusiveMaximum: true }
                    expectedMinimum: { type: integer, enum: [80] }
                    observedAt: { type: string, format: date-time }
                    accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                    expiresAt: { type: string, format: date-time }
                  additionalProperties: false
                attemptSummary:
                  type: object
                  required: [attemptId, taskType, score, maxScore, observedAt, accentLocale]
                  properties:
                    attemptId: { type: integer, minimum: 1 }
                    taskType: { type: integer, enum: [1, 2, 3, 4] }
                    score: { type: number, minimum: 0, maximum: 10 }
                    maxScore: { type: integer, enum: [1, 4, 5, 10] }
                    observedAt: { type: string, format: date-time, nullable: true }
                    accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                  additionalProperties: false
              additionalProperties: false
            timeAllocationRecommendation:
              type: array
              maxItems: 4
              items:
                type: object
                required: [skillId, label, focus, accentLocale, percentage]
                properties:
                  skillId: { $ref: '#/components/schemas/SpeakingAdaptiveSkillId' }
                  label: { type: string, maxLength: 160 }
                  focus:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/SpeakingPronunciationFocus' }]
                  accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                  percentage: { type: integer, minimum: 0, maximum: 100 }
                additionalProperties: false
            personalSummary:
              type: object
              required: [reliableAttemptCount, currentReliableAttemptId, currentReliableAccentLocale, priorityCount, unavailableTargetCount]
              properties:
                reliableAttemptCount: { type: integer, minimum: 0, maximum: 120 }
                currentReliableAttemptId: { type: integer, nullable: true, minimum: 1 }
                currentReliableAccentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
                priorityCount: { type: integer, minimum: 0, maximum: 4 }
                unavailableTargetCount: { type: integer, minimum: 0, maximum: 240 }
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    SpeakingIssueDynamics:
      type: array
      maxItems: 30
      items:
        type: object
        required: [label, accentLocale, count, averageAccuracy, previousAccuracy, currentAccuracy, delta, direction, points]
        properties:
          label: { type: string, maxLength: 120 }
          accentLocale: { type: string, nullable: true, enum: [en-GB, en-US] }
          count: { type: integer, minimum: 1, maximum: 120 }
          averageAccuracy: { type: integer, nullable: true, minimum: 0, maximum: 100 }
          previousAccuracy: { type: integer, nullable: true, minimum: 0, maximum: 100 }
          currentAccuracy: { type: integer, nullable: true, minimum: 0, maximum: 100 }
          delta: { type: integer, nullable: true, minimum: -100, maximum: 100 }
          direction: { type: string, enum: [improved, declined, stable, insufficient_data] }
          points:
            type: array
            maxItems: 120
            items:
              type: object
              required: [attemptId, observedAt, accuracyScore]
              properties:
                attemptId: { type: integer, minimum: 1 }
                observedAt: { type: string, format: date-time, nullable: true }
                accuracyScore: { type: integer, minimum: 0, maximum: 100 }
              additionalProperties: false
        additionalProperties: false
    SpeakingTask1Task:
      type: object
      required: [id, revision, taskType, cefr, topic, preparationSeconds, responseSeconds, maxScore, instruction, text]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        revision: { type: integer, minimum: 1 }
        taskType: { type: integer, enum: [1] }
        cefr: { type: string, enum: [B1, B2, B2+/C1] }
        topic: { type: string, minLength: 1, maxLength: 120 }
        preparationSeconds: { type: integer, enum: [90] }
        responseSeconds: { type: integer, enum: [90] }
        maxScore: { type: integer, enum: [1] }
        instruction: { type: string, minLength: 1, maxLength: 300 }
        text: { type: string, minLength: 1, maxLength: 2000 }
      additionalProperties: false
    SpeakingTask1Completion:
      type: object
      required: [recordingDurationSeconds, micCheck, localPlayback, selfRating]
      properties:
        recordingDurationSeconds: { type: number, minimum: 1, maximum: 90 }
        micCheck: { type: string, enum: [passed, quiet, skipped] }
        localPlayback: { type: boolean }
        selfRating: { type: string, enum: [weak, steady, strong] }
      additionalProperties: false
    SpeakingTask1Session:
      type: object
      required: [id, catalog, task, selectionReason, targetedPractice, status, assistanceUsed, assignedAt, completedAt, practice, pronunciationAssessment]
      properties:
        id: { type: string, format: uuid }
        catalog:
          type: object
          required: [id, revision]
          properties:
            id: { type: string, enum: [speaking-pilot-v1] }
            revision: { type: integer, enum: [1] }
          additionalProperties: false
        task: { $ref: '#/components/schemas/SpeakingTask1Task' }
        selectionReason: { type: string, enum: [unseen, due, weak, old, targeted_focus] }
        targetedPractice:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/SpeakingAssignedTargetedPractice' }]
        status: { type: string, enum: [assigned, completed] }
        assistanceUsed: { type: boolean }
        assignedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        practice:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SpeakingTask1Completion'
        pronunciationAssessment:
          type: object
          required: [available, reason, message]
          properties:
            available: { type: boolean, enum: [false] }
            reason: { type: string, enum: [provider_not_connected] }
            message: { type: string }
          additionalProperties: false
      additionalProperties: false
    SpeakingTask2Task:
      type: object
      required: [id, revision, taskType, cefr, topic, preparationSeconds, questionSeconds, maxScore, instruction, advertisement, supports]
      properties:
        id: { type: string, minLength: 1, maxLength: 140 }
        revision: { type: integer, enum: [1] }
        taskType: { type: integer, enum: [2] }
        cefr: { type: string, enum: [B1, B2, B2+/C1] }
        topic: { type: string, minLength: 1, maxLength: 80 }
        preparationSeconds: { type: integer, enum: [60] }
        questionSeconds: { type: integer, enum: [20] }
        maxScore: { type: integer, enum: [4] }
        instruction: { type: string, minLength: 1, maxLength: 300 }
        advertisement: { type: string, minLength: 1, maxLength: 600 }
        supports:
          type: array
