        completedBlock: { $ref: '#/components/schemas/AdaptiveSessionCompletedBlock' }
        profileBefore: { type: object, additionalProperties: true }
        profileAfter: { type: object, additionalProperties: true }
        profileChange: { type: object, additionalProperties: true }
        planBefore: { type: object, nullable: true, additionalProperties: true }
        planAfter: { type: object, nullable: true, additionalProperties: true }
        planChange: { type: object, additionalProperties: true }
        nextAction: { $ref: '#/components/schemas/AdaptiveSessionNextAction' }
      additionalProperties: false
    AdaptiveSessionFinishResult:
      type: object
      required: [session, execution, summary, nextAction]
