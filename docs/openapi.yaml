              additionalProperties: false
      responses:
        '201':
          description: Goal revision created and returned as one current goal/profile/plan snapshot
          headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } }
