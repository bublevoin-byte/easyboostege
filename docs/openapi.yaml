                - type: object
                  required: [attemptId, taskId, answer, adaptiveExecutionClaim, adaptiveSessionId]
                  properties:
                    attemptId: { type: string, format: uuid }
                    taskId: { type: string, minLength: 4, maxLength: 180 }
                    answer: { type: string, minLength: 1, maxLength: 200, description: Checked transiently and never persisted }
                    adaptiveExecutionClaim: { type: string, minLength: 32, maxLength: 200, description: Binds this exact existing repeat attempt to the active adaptive retention block. }
                    adaptiveSessionId: { type: string, format: uuid }
                  additionalProperties: false
      responses:
        '201': { description: New bounded pass/fail outcome; answer text is absent, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } } }
        '200': { description: Idempotent replay of the same attempt UUID and payload, headers: { X-EasyBoost-Response-Owner: { $ref: '#/components/headers/X-EasyBoost-Response-Owner' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Repeat does not belong to the current user }
