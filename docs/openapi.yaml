                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, minLength: 1, maxLength: 200 }
              additionalProperties: false
      responses:
        '201': { description: Canonical result and deterministic child error attempts recorded }
        '200': { description: Existing idempotent result returned with the same child error attempt ids }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: The current subscription has no voice_tutor entitlement }
        '409': { description: Canonical set revision is stale, or the result UUID was already bound to different answers }
        '422': { description: Set, answer count, or an answer option does not match server-owned content }
  /api/v1/voice-tutor/sessions:
    post:
      summary: Reserve Voice Tutor quota and build a server-owned supported-module capsule (or mark trusted discovery required)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        description: Omit the body for the legacy quota-only reservation. Grammar/lexicon/reading/listening send a UUID attempt pointer; writing/speaking send a server-issued numeric review pointer, source and one server-issued lost-criterion index. A max-score Speaking result may instead send its exact unexpired server-issued pronunciation-error ref. No answer, transcript, assignment or review is accepted here.
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [attemptId, revision]
                  properties:
                    attemptId: { type: string, format: uuid }
                    revision: { type: integer, minimum: 1, maximum: 10000 }
                  additionalProperties: false
                - type: object
                  required: [source, attemptId, revision, criterionIndex]
                  properties:
                    source: { type: string, enum: [writing, speaking] }
                    attemptId: { type: integer, minimum: 1 }
                    revision: { type: integer, minimum: 1, maximum: 10000 }
                    criterionIndex: { type: integer, minimum: 0, maximum: 20 }
                  additionalProperties: false
                - type: object
                  required: [source, attemptId, revision, pronunciationErrorRef]
                  properties:
                    source: { type: string, enum: [speaking] }
                    attemptId: { type: integer, minimum: 1 }
                    revision: { type: integer, enum: [1] }
                    pronunciationErrorRef:
                      type: string
                      maxLength: 120
                      pattern: '^(?:word|phoneme)\.[0-9]+\.[0-9]+(?:\.[0-9]+)?$'
                  additionalProperties: false
      responses:
        '201': { description: Capsule created. Voice mode exposes only a random one-use application ticket, expires_at clamped to the reserved session deadline, same-origin proxy_url and pedagogy nonce. Provider credentials, URL, prompt, model and tools remain server-only. Policy/configuration fallback is selected before reservation; after reservation, only an explicitly classified provider-unavailable ticket failure may return the same capsule in text/local mode. Subscription, Premium, pronunciation-pointer, session-integrity, expiry and conflict errors propagate without fallback, AI call or nonce rotation. }
        '200': { description: Existing idempotent result. The owner-serialized replay first rechecks the active Base subscription and Premium entitlement at fresh authority time. For a pronunciation capsule it also reloads the owner attempt and revalidates assistance, mastery eligibility, exact weakest ref and 30-day expiry inside that same mutation. A lost voice 201 returns realtime.status=reissue_required and a bounded realtime.reissue_url, never the original ticket or nonce. A provisional voice reservation with no issued ticket atomically receives its first ticket plus a replacement nonce, or becomes zero-billable local mode when realtime is unavailable. A lost text/local 201 atomically rotates and returns one replacement pedagogy nonce without repeating the AI call. A legacy or partially committed null delivery is atomically completed as zero-billable local mode. Any recovery is allowed exactly once. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The fresh owner-locked subscription or voice_tutor entitlement is inactive; exact replay returns no session payload and cannot issue or rotate a ticket or nonce }
        '409': { description: Another Voice Tutor session is active, or the selected server-owned speaking pronunciation pointer is stale or expired }
        '422': { description: Attempt, canonical item/context, or completed validated writing/speaking review is not supported }
        '429': { description: Daily or monthly voice quota is exhausted }
        '503': { description: New quota-only voice reservation is disabled by the feature flag, cost kill switch or required-but-unconfirmed ZDR policy; tracer requests continue with text/local fallback in a 201 response }
  /api/v1/voice-tutor/rule-discoveries:
