        weeklyMinutes: { type: integer, minimum: 30, maximum: 2520, multipleOf: 5 }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false
    AdaptiveSkillEstimate:
      type: object
      required: [id, label, module, mastery, uncertainty, status, evidenceCount, effectiveEvidenceCount, independentEvidenceCount, evidenceQuality, lastObservedAt, dueState, criticalRetentionExpiresAt, explanationCode]
      properties:
        id: { type: string, maxLength: 120 }
        label: { type: string, maxLength: 160 }
        module: { type: string, enum: [grammar, vocabulary, reading, listening, writing, speaking] }
        mastery:
          type: integer
          minimum: 0
          maximum: 100
          description: Conservative estimate; without independent evidence it cannot exceed 49.
        uncertainty:
          type: integer
          minimum: 0
          maximum: 100
          description: Reduced only by independent unassisted or retention evidence.
        status:
          type: string
          enum: [unobserved, preliminary, established]
          description: A skill is established only after at least two independent observations.
        evidenceCount: { type: integer, minimum: 0 }
        effectiveEvidenceCount:
          type: integer
          minimum: 0
          description: Observations used in scoring after trust ceilings; raw evidenceCount remains auditable.
        independentEvidenceCount: { type: integer, minimum: 0 }
        evidenceQuality: { type: string, enum: [none, client_reported, assisted, independent, mixed] }
        lastObservedAt: { type: string, format: date-time, nullable: true }
        dueState: { type: string, enum: [not_due, due, overdue, critical_due] }
        criticalRetentionExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Server-derived end of an expiring day-1/day-7 review window; never accepted as learner evidence.
        explanationCode: { type: string, maxLength: 40 }
      additionalProperties: false
    AdaptiveProfile:
      type: object
      required: [taxonomyVersion, weightingVersion, profileCalculationRevision, evidenceWatermarkVersion, evidenceObservedAt, evidenceSourceCount, evidenceFingerprint, preliminary, status, confidence, evidenceCount, independentEvidenceCount, assistedEvidenceCount, clientReportedEvidenceCount, independentModuleCount, establishedSkillCount, needsDiagnostic, explanationCodes, skills, modules]
      properties:
        taxonomyVersion: { type: string, enum: [ege-en-v2] }
        weightingVersion: { type: string, enum: [adaptive-evidence-v2] }
        profileCalculationRevision:
          type: integer
          minimum: 1
          description: Higher profileCalculationRevision wins first, so a newer algorithm may intentionally filter sources. Revision 4 keeps assisted evidence observable but gives it zero positive mastery weight; it preserves the revision-3 21-skill Speaking taxonomy and criterion-safe Voice Tutor compatibility and the revision-2 exclusion of client_reported productive attempts. Within the same calculation revision, evidenceSourceCount is monotonic. Fingerprint, evidenceSourceCount and evidenceObservedAt come from one canonical eligible-source projection and are validated as one vector against the current revision before plan replay or persistence.
        evidenceWatermarkVersion: { type: string, enum: [adaptive-evidence-watermark-v1] }
        evidenceObservedAt:
          type: string
          format: date-time
          nullable: true
          description: Latest timestamp in the same canonical eligible-source projection that produces source count and fingerprint. Date, ISO, epoch-millisecond and epoch-second representations normalize to one ISO instant.
        evidenceSourceCount:
          type: integer
          minimum: 0
          description: Count of the canonical eligible-source projection; excluded client-reported productive or unsupported events cannot advance this field.
        evidenceFingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
