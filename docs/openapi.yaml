openapi: 3.0.3
info:
  title: Easy Boost API
  version: 1.0.0
  description: Production HTTP API. Authentication uses an HttpOnly SameSite cookie.
servers:
  - url: https://useboost.ru
security:
  - cookieAuth: []
paths:
  /api/v1/admin/metrics:
    get:
      summary: Read process uptime plus bounded PII-free HTTP, Voice Tutor and adaptive-learning metrics
      description: The adaptiveLearning projection is versioned as adaptive-metrics-v1 and contains only fixed-cardinality aggregate counters/rates for its explicit rolling 90-day UTC window. It never contains username, owner/session/attempt/skill identifiers, answers, free text, transcript, audio, credentials or idempotency values. startRate uses created as denominator; completionRate uses started; plannedMinutesCompletionRate uses planned learning minutes; retention rates use observed verified repeat outcomes. Empty denominators produce rate 0. See docs/ADAPTIVE_LEARNING_OPERATIONS.md for sample gates and incident handling.
      responses:
        '200':
          description: Metrics snapshot for an administrator, including adaptiveLearning when the repository supports it
          content:
            application/json:
              schema:
                type: object
                properties:
                  adaptiveLearning: { $ref: '#/components/schemas/AdaptiveLearningMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health/live:
    get:
      security: []
      summary: Process liveness
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      security: []
      summary: Application and database readiness
      responses:
        '200': { description: Ready }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/tg/start:
    post:
      security: []
      summary: Create a short-lived Telegram authorization code
      responses:
        '200':
          description: Authorization URL and opaque code
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/tg/check:
    get:
      security: []
      summary: Check and consume Telegram authorization code
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string, maxLength: 256 }
      responses:
        '200': { description: Pending or authenticated state }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/speaking/accent-profile:
    get:
      summary: Read the learner's future-effective Speaking accent profile
      description: Returns the current en-GB/en-US profile and a resumable one-time setup pointer. The profile is owner-bound; changes never rewrite a session snapshot or an earlier assessment.
      responses:
        '200':
          description: Current profile, pending one-time setup and setup-required flag
          content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingAccentProfileState' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Select en-GB or en-US for future Speaking sessions
      description: Creates an audited future-effective revision. Manual selection atomically cancels any pending one-time comparison, which can no longer complete or overwrite the explicit choice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties: { locale: { type: string, enum: [en-GB, en-US] } }
              additionalProperties: false
      responses:
        '200': { description: Audited profile revision, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingAccentProfileMutation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/speaking/accent-profile/calibration:
    post:
      summary: Start the one-time unknown-accent comparison
      description: Creates one owner-bound setup only while no accent profile exists. It accepts no client scores and can never be restarted after completion or manual cancellation.
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '201': { description: Pending setup pointer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Setup was already used or an accent profile already exists }
  /api/v1/speaking/accent-profile/calibration/{setupId}/complete:
    post:
      summary: Complete one dual-accent setup from two final owner-bound assessments
      description: Both assessment keys must refer to the same server-owned task context, one en-GB and one en-US. The server makes one versioned suggestion; ordinary attempts never cherry-pick the higher accent score.
      parameters:
        - { in: path, name: setupId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enGbAssessmentKey, enUsAssessmentKey]
              properties:
                enGbAssessmentKey: { type: string, format: uuid }
                enUsAssessmentKey: { type: string, format: uuid }
              additionalProperties: false
      responses:
        '200': { description: Suggested profile and bounded confidence label }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Invalid, foreign, mismatched or already-used evidence }
  /api/v1/speaking/calibration-consent:
    get:
      summary: Read the separate research-calibration consent
      description: This consent is independent from ordinary voice processing. Declining or revoking it does not restrict training or paid subscription features.
      responses:
        '200': { description: Current consent and current policy version }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Grant or revoke voluntary research-calibration consent
      description: A minor requires explicit guardian confirmation. Revocation immediately deletes retained owner-bound calibration audio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted, ageGroup, guardianConfirmed]
              properties:
                granted: { type: boolean }
                ageGroup: { type: string, enum: [adult, minor] }
                guardianConfirmed: { type: boolean }
              additionalProperties: false
      responses:
        '200': { description: Updated separate consent, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingCalibrationConsent' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Guardian confirmation is required }
  /api/v1/speaking/calibration-samples:
    post:
      summary: Voluntarily retain one finalized assessment recording for blinded calibration
      description: Requires separate current calibration consent and an owner-bound finalized assessment key in X-Speaking-Assessment-Key. The SHA-256 digest of the submitted PCM WAV must match the exact audio assessed under that key. Task 2/3 item-level recordings are not complete task labels and are rejected until a server-owned aggregate enrollment exists. The WAV is capped at 10 MiB and expires within 180 days. No ordinary recording is retained by this endpoint implicitly.
      parameters:
        - { in: header, name: X-Speaking-Assessment-Key, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary, maxLength: 10485760, x-maxBytes: 10485760 } }
      responses:
        '201': { description: Owner-visible allowlisted sample metadata, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingCalibrationSample' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Consent or assessment evidence is missing }
        '413': { description: Audio exceeds the configured ceiling }
  /api/v1/speaking/calibration-reviews/next:
    get:
      summary: Claim the next blinded calibration card as an administrator
      description: No direct learner identifiers are exposed. The card includes immutable enrolled task and rubric snapshots copied from the validated server catalog when the owner contributes audio, so later catalog rollout cannot alter or strand it. A reviewer can never claim the same sample for a second independent position; each claim lease lasts 15 minutes but never extends the sample's 180-day expiry.
      responses:
        '200': { description: Blinded task and scoring card, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingCalibrationExpertCard' } } } }
        '204': { description: No eligible sample }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/speaking/calibration-reviews/{sampleId}/audio:
    get:
      summary: Read claimed calibration audio as an administrator
      description: Available only to the same administrator during the active 15-minute claim lease, before the exact 180-day expiry and before raw deletion.
      parameters:
        - { in: path, name: sampleId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Temporary raw PCM WAV, content: { audio/wav: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Sample is unclaimed, expired or already erased }
  /api/v1/speaking/calibration-reviews/{sampleId}:
    post:
      summary: Submit one independent blinded rating
      description: Only sufficient independent ratings count. Two agreeing sufficient positions complete the sample; material disagreement requires a third sufficient independent adjudicator before raw deletion. An insufficient rating leaves audio queued until enough sufficient ratings, revocation or expiry.
      parameters:
        - { in: path, name: sampleId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [sufficient]
                  properties:
                    sufficient: { type: boolean, enum: [false] }
                  additionalProperties: false
                - type: object
                  required: [sufficient, score, criticalError]
                  properties:
                    sufficient: { type: boolean, enum: [true] }
                    score: { type: integer, minimum: 0, maximum: 10 }
                    criticalError: { type: boolean }
                  additionalProperties: false
      responses:
        '200': { description: Bounded review count, state and raw-audio retention flag }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Claim, independence or availability conflict }
  /api/v1/speaking/pronunciation-assessments/status:
    get:
      summary: Read Azure pronunciation availability and the current monthly seconds ledger
      description: Requires an active subscription. Local recording and playback do not call this paid assessment path and consume zero seconds. Missing configuration or the optional official SDK is returned as an honest unavailable state.
      responses:
        '200':
          description: Bounded provider state and authoritative Base/Premium monthly quota
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeakingPronunciationStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/speaking/learning-report:
    get:
      summary: Read the learner's current Speaking analysis and adaptive next step
      description: Requires an active subscription, rechecked under the owner lock immediately before the snapshot is built; expiry after the route precheck returns SUBSCRIPTION_REQUIRED without report data. Base receives the complete latest bounded analysis and its 60-minute monthly pronunciation allowance. Premium receives the same official result, a 240-minute allowance, longitudinal dynamics, comparison, targeted practice on a different suitable server-owned task when such material exists, and a bounded Voice Tutor pointer. If the catalog has no suitable focus material, the report exposes that target as unavailable instead of silently substituting an unrelated task. Assisted, technically invalid or low-confidence attempts remain visible but never raise mastery.
      responses:
        '200':
          description: Fresh entitlement-aware Speaking learning report; no raw audio or provider payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeakingLearningReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/speaking/task-{taskType}/sessions/{sessionId}/assistance:
    post:
      summary: Mark an owner-bound Speaking session as assisted before help is shown
      description: Server-owned, irreversible and idempotent marker. The body must be empty. Any evaluation from this exact session remains useful for feedback but cannot raise adaptive mastery.
      parameters:
        - { in: path, name: taskType, required: true, schema: { type: integer, enum: [1, 2, 3, 4] } }
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Assistance marker stored for the exact session
          content:
            application/json:
              schema:
                type: object
                required: [assistanceUsed]
                properties:
                  assistanceUsed: { type: boolean, enum: [true] }
                additionalProperties: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found for this learner and task type }
  /api/v1/speaking/task-1/sessions/{sessionId}/pronunciation-assessment:
    post:
      summary: Assess one owner-bound task 1 recording with the server-owned reference text
      description: The server loads the pinned task text and never accepts reference text, rubric, tariff or provider settings from the client. The current production SDK seam accepts validated mono 16-bit PCM WAV at 16 kHz only; encoded WebM/MP4/MP3/Ogg requires a separately verified transcoder and is rejected before reservation. Duration is derived from the WAV data chunk, checked against the header and the server-owned 90-second task bound. A reservation is created atomically before Azure starts. Timeout or provider error after continuous recognition starts conservatively bills the full reservation, while a pre-start failure releases it. A five-minute lease reconciles interrupted pre-start work to a canonical zero-bill release and interrupted post-start work to a canonical full-reservation settlement. Exact idempotent replay returns that canonical result without a second charge.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Speech-Locale
          required: true
          schema: { type: string, enum: [en-GB, en-US] }
        - in: header
          name: X-Audio-Duration-Seconds
          required: true
          schema: { type: number, minimum: 1, maximum: 90 }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary, maxLength: 10485760, x-maxBytes: 10485760 } }
      responses:
        '200':
          description: Bounded normalized result, billing settlement and remaining quota; never raw provider payload, credentials or audio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeakingPronunciationAssessment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found for this learner }
        '409': { description: Idempotency key conflict or incompatible catalog revision }
        '413': { description: Audio exceeds the configured 10 MiB ceiling }
        '415': { description: Unsupported audio MIME type }
        '429': { description: Monthly provider seconds exhausted; local recording remains available }
        '503': { description: Azure configuration or the optional official SDK is unavailable }
  /api/v1/speaking/task-2/sessions/{sessionId}/pronunciation-assessment:
    post:
      summary: Assess one owner-bound task 2 direct question
      description: Accepts only mono PCM16 16 kHz WAV. X-Speaking-Item binds the recording to one of the four server-owned supports. The server stores no audio and rejects an invalid owner, catalog revision or item before provider work.
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Speech-Locale, required: true, schema: { type: string, enum: [en-GB, en-US] } }
        - { in: header, name: X-Audio-Duration-Seconds, required: true, schema: { type: number, minimum: 1, maximum: 20 } }
        - { in: header, name: X-Speaking-Item, required: true, schema: { type: integer, minimum: 1, maximum: 4 } }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary, maxLength: 10485760, x-maxBytes: 10485760 } }
      responses:
        '200': { description: Final normalized assessment, billing settlement and quota, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingPronunciationAssessment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found for this learner }
        '409': { description: Idempotency key conflict or incompatible catalog revision }
        '413': { description: Audio exceeds the configured ceiling }
        '415': { description: Unsupported audio MIME type }
        '429': { description: Monthly provider seconds exhausted }
        '503': { description: Pronunciation provider unavailable }
  /api/v1/speaking/task-3/sessions/{sessionId}/pronunciation-assessment:
    post:
      summary: Assess one owner-bound task 3 interview answer
      description: Accepts only mono PCM16 16 kHz WAV. X-Speaking-Item binds the recording to one of the five server-owned questions. The server stores no audio.
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Speech-Locale, required: true, schema: { type: string, enum: [en-GB, en-US] } }
        - { in: header, name: X-Audio-Duration-Seconds, required: true, schema: { type: number, minimum: 1, maximum: 40 } }
        - { in: header, name: X-Speaking-Item, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary, maxLength: 10485760, x-maxBytes: 10485760 } }
      responses:
        '200': { description: Final normalized assessment, billing settlement and quota, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingPronunciationAssessment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found for this learner }
        '409': { description: Idempotency key conflict or incompatible catalog revision }
        '413': { description: Audio exceeds the configured ceiling }
        '415': { description: Unsupported audio MIME type }
        '429': { description: Monthly provider seconds exhausted }
        '503': { description: Pronunciation provider unavailable }
  /api/v1/speaking/task-4/sessions/{sessionId}/pronunciation-assessment:
    post:
      summary: Assess one owner-bound task 4 monologue
      description: Accepts only mono PCM16 16 kHz WAV up to the official 180-second response bound. The server stores no audio and attaches the final assessment only to the exact pinned catalog session.
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Speech-Locale, required: true, schema: { type: string, enum: [en-GB, en-US] } }
        - { in: header, name: X-Audio-Duration-Seconds, required: true, schema: { type: number, minimum: 1, maximum: 180 } }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary, maxLength: 10485760, x-maxBytes: 10485760 } }
      responses:
        '200': { description: Final normalized assessment, billing settlement and quota, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingPronunciationAssessment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found for this learner }
        '409': { description: Idempotency key conflict or incompatible catalog revision }
        '413': { description: Audio exceeds the configured ceiling }
        '415': { description: Unsupported audio MIME type }
        '429': { description: Monthly provider seconds exhausted }
        '503': { description: Pronunciation provider unavailable }
  /api/v1/speaking/task-1/sessions:
    post:
      summary: Assign one server-owned Speaking task 1 text to the current learner
      description: Selects from the versioned 60-item catalog using unseen, due, weak, then old rotation without immediately repeating a text when an alternative exists. Requires an active base subscription and a saved accent profile. For targeted practice the active base subscription is rechecked under the owner lock before Premium or pointer validation; an intervening Base expiry returns SUBSCRIPTION_REQUIRED and creates no session, while a Premium-only downgrade keeps Base access and makes the pointer stale. Premium may send the exact current targeted-practice pointer from the learning report; the server revalidates it and excludes the source material. The only first-run exception is the exact pending calibration setup owned by the learner; its setup ID permits task 1 only until the learner chooses en-GB or en-US.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                calibrationSetupId: { type: string, format: uuid }
                targetedPractice: { $ref: '#/components/schemas/SpeakingTargetedPracticeRequest' }
      responses:
        '201':
          description: Owner-bound task 1 session with official 90-second preparation and response stages; no answer key, source provenance, audio, transcript, or phonetic score is exposed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeakingTask1Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Accent profile is required, calibrationSetupId is not the learner's exact pending first-run setup, or the targeted-practice pointer is stale }
  /api/v1/speaking/task-1/sessions/{sessionId}:
    get:
      summary: Read the current learner's Speaking task 1 session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The owner-bound session and safe practice metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeakingTask1Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found for this learner }
        '409': { description: The stored session uses an incompatible catalog revision and must be restarted safely }
  /api/v1/speaking/task-1/sessions/{sessionId}/complete:
    post:
      summary: Complete a Speaking task 1 session with bounded practice metadata
      description: Stores duration, microphone-check status, local-playback confirmation and self-rating only. The browser recording remains local. Automatic training assessment is a separate, explicit post-completion upload action.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeakingTask1Completion' }
      responses:
        '200':
          description: Completed owner-bound session; retries return the canonical stored metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeakingTask1Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found for this learner }
  /api/v1/speaking/task-2/sessions:
    post:
      summary: Assign one server-owned Speaking task 2 advertisement to the current learner
      description: Selects from the validated 60-item catalog. The server fixes the advertisement and exactly four communicative supports under the EGE-2026 60-second preparation and four-by-20-second contract. Premium may send the exact fresh targeted-practice pointer; under the owner lock the server first rechecks active Base access, then Premium and pointer freshness, so Base expiry returns SUBSCRIPTION_REQUIRED without creating a session. The source assignment is excluded and the selector uses a different suitable server-owned task. A saved accent profile is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetedPractice: { $ref: '#/components/schemas/SpeakingTargetedPracticeRequest' }
              additionalProperties: false
      responses:
        '201':
          description: Owner-bound task 2 session with four pending question positions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeakingTask2Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Accent profile is required, or the targeted-practice pointer is stale }
  /api/v1/speaking/task-2/sessions/{sessionId}:
    get:
      summary: Restore the current learner's Speaking task 2 session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The owner-bound assignment and safe per-question practice metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeakingTask2Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Session not found for this learner }
        '409': { description: The stored session uses an incompatible catalog revision and must be restarted safely }
  /api/v1/speaking/task-2/sessions/{sessionId}/questions/{questionNumber}/complete:
    post:
      summary: Complete the current local question recording with safe metadata
      description: Accepts questions 1 through 4 in order. Binary audio stays in the browser; retries of a completed position return its canonical stored metadata.
      parameters:
        - in: path
          name: sessionId
