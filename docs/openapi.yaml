    AdaptiveSessionCompletedBlock:
      type: object
      required: [blockId, kind, module, skillId, activityId, plannedMinutes, actualMinutes, attempt, evidenceQuality, evidenceContext]
      properties:
        blockId: { type: string }
        kind: { type: string, enum: [learning, break] }
        module: { type: string, nullable: true }
        skillId: { type: string, nullable: true }
        activityId: { type: string, nullable: true }
        plannedMinutes: { type: integer, minimum: 0 }
        actualMinutes: { type: integer, minimum: 0, nullable: true }
        attempt: { type: object, nullable: true, additionalProperties: true }
        evidenceQuality: { type: string, enum: [client_reported, server_verified_unassisted, server_verified_assisted], nullable: true }
        evidenceContext: { type: string, enum: [exam_practice, planned_practice, scheduled_review, ai_assisted_review], nullable: true }
      additionalProperties: false
    AdaptiveSessionNextAction:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [start_block, take_break, finish_session, create_personal_session] }
        blockId: { type: string }
        sessionId: { type: string, format: uuid }
        suggestedMinutes: { type: integer, minimum: 15, maximum: 120 }
      additionalProperties: false
    AdaptiveSessionSummary:
      type: object
      required: [completedBlocks, completedLearningBlocks, plannedLearningMinutes, actualLearningMinutes, actualMinutesComplete, evidenceByQuality, evidenceByContext, completedWork, planChange, nextRecommendedAction]
      properties:
        completedBlocks: { type: integer, minimum: 0 }
        completedLearningBlocks: { type: integer, minimum: 0 }
        plannedLearningMinutes: { type: integer, minimum: 0 }
        actualLearningMinutes: { type: integer, minimum: 0 }
        actualMinutesComplete: { type: boolean }
        evidenceByQuality: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        evidenceByContext: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        completedWork:
          type: array
          items:
            type: object
            required: [blockId, module, skillId, activityId, activityLabel, plannedMinutes, actualMinutes, evidenceQuality, evidenceContext]
            properties:
              blockId: { type: string }
              module: { type: string }
              skillId: { type: string }
              activityId: { type: string }
              activityLabel: { type: string }
              plannedMinutes: { type: integer, minimum: 0 }
              actualMinutes: { type: integer, minimum: 0, nullable: true }
              evidenceQuality: { type: string, enum: [client_reported, server_verified_unassisted, server_verified_assisted], nullable: true }
              evidenceContext: { type: string, enum: [exam_practice, planned_practice, scheduled_review, ai_assisted_review], nullable: true }
            additionalProperties: false
        planChange:
          type: object
          required: [planRevisionBefore, planRevisionAfter, changed]
          properties:
            planRevisionBefore: { type: integer, minimum: 0 }
            planRevisionAfter: { type: integer, minimum: 0 }
            changed: { type: boolean }
          additionalProperties: false
        nextRecommendedAction: { $ref: '#/components/schemas/AdaptiveSessionNextAction' }
      additionalProperties: false
    AdaptiveSessionStartResult:
      oneOf:
        - $ref: '#/components/schemas/AdaptiveSessionClaimStartResult'
        - $ref: '#/components/schemas/AdaptiveSessionRecoveryStartResult'
    AdaptiveSessionClaimStartResult:
      type: object
      required: [session, execution, block, launch, executionClaim, claimExpiresAt, evidenceContext]
      properties:
        session: { $ref: '#/components/schemas/AdaptiveLearningSession' }
        execution: { $ref: '#/components/schemas/AdaptiveSessionExecution' }
        block: { $ref: '#/components/schemas/AdaptiveSessionBlock' }
        launch: { type: object, additionalProperties: true }
        executionClaim: { type: string, minLength: 32, maxLength: 200 }
        claimExpiresAt: { type: string, format: date-time }
        evidenceContext: { type: string, enum: [exam_practice, planned_practice, scheduled_review, ai_assisted_review] }
      additionalProperties: false
    AdaptiveSessionRecoveryStartResult:
      type: object
      required: [session, execution, block, launch, evidenceContext, recoveryAttempt]
      properties:
        session: { $ref: '#/components/schemas/AdaptiveLearningSession' }
        execution: { $ref: '#/components/schemas/AdaptiveSessionExecution' }
        block: { $ref: '#/components/schemas/AdaptiveSessionBlock' }
        launch: { type: object, additionalProperties: true }
        evidenceContext: { type: string, enum: [exam_practice, planned_practice, scheduled_review, ai_assisted_review] }
        recoveryAttempt:
          oneOf:
            - type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [module, voice_tutor_repeat] }
                id: { type: string, format: uuid }
              additionalProperties: false
            - type: object
              required: [type, id]
              properties:
                type: { type: string, enum: [writing, speaking] }
                id: { type: integer, minimum: 1 }
              additionalProperties: false
      additionalProperties: false
    AdaptiveSessionAdvanceResult:
      type: object
      required: [session, execution, completedBlock, profileBefore, profileAfter, profileChange, planBefore, planAfter, planChange, nextAction]
      properties:
        session: { $ref: '#/components/schemas/AdaptiveLearningSession' }
        execution: { $ref: '#/components/schemas/AdaptiveSessionExecution' }
        completedBlock: { $ref: '#/components/schemas/AdaptiveSessionCompletedBlock' }
        profileBefore: { type: object, additionalProperties: true }
        profileAfter: { type: object, additionalProperties: true }
        profileChange: { type: object, additionalProperties: true }
        planBefore: { type: object, nullable: true, additionalProperties: true }
        planAfter: { type: object, nullable: true, additionalProperties: true }
        planChange: { type: object, additionalProperties: true }
        nextAction: { $ref: '#/components/schemas/AdaptiveSessionNextAction' }
      additionalProperties: false
    AdaptiveSessionFinishResult:
      type: object
      required: [session, execution, summary, nextAction]
      properties:
        session: { $ref: '#/components/schemas/AdaptiveLearningSession' }
        execution: { $ref: '#/components/schemas/AdaptiveSessionExecution' }
        summary: { $ref: '#/components/schemas/AdaptiveSessionSummary' }
        nextAction: { $ref: '#/components/schemas/AdaptiveSessionNextAction' }
      additionalProperties: false
    PaymentRequest:
      type: object
      required: [id, product, status]
      properties:
        id: { type: string, format: uuid }
        product: { type: string, enum: [base, premium_voice] }
        status: { type: string, enum: [new, approved, rejected] }
      additionalProperties: false
    Progress:
      type: object
      properties:
        learnerPreferences: { $ref: '#/components/schemas/LearnerPreferences' }
      additionalProperties: true
    LearnerPreferences:
      type: object
      required: [version, schoolGrade, preferredSessionMinutes]
      properties:
        version: { type: integer, enum: [1] }
        schoolGrade: { type: integer, nullable: true, minimum: 8, maximum: 11 }
        preferredSessionMinutes: { type: integer, minimum: 15, maximum: 120, multipleOf: 5, default: 30 }
      additionalProperties: false
    ExperimentalAssessment:
      type: object
      required: [mode, scoreKind, warning]
      properties:
        mode: { type: string, enum: [experimental] }
        scoreKind: { type: string, enum: [approximate] }
        warning: { type: string }
    WritingEvaluationScope:
      type: object
      required: [fullWords, evaluatedWords, truncated, evaluatedLimit]
      properties:
        fullWords: { type: integer, minimum: 0 }
        evaluatedWords: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        evaluatedLimit: { type: integer, enum: [140, 250] }
  responses:
    BadRequest: { description: Invalid request }
    Unauthorized: { description: Missing or expired session }
    Forbidden: { description: Subscription inactive }
    RateLimited: { description: Rate limit exceeded }
    ServiceUnavailable: { description: Dependency unavailable }
