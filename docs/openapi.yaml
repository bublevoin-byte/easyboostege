        profile: { $ref: '#/components/schemas/AdaptiveProfile' }
        plan: { $ref: '#/components/schemas/AdaptivePlan' }
      additionalProperties: false
    AdaptiveForecastChoice:
      type: object
      required: [type, reasonCode]
      properties:
        type: { type: string, enum: [increase_weekly_time, adjust_target_score, update_exam_date] }
        weeklyMinutes: { type: integer, minimum: 30, maximum: 2520, multipleOf: 5, description: Present only when it strictly exceeds availableWeeklyMinutes; capped at 2520. }
        targetScore: { type: integer, minimum: 0, maximum: 100, description: For an active unlikely forecast, lies between currentEstimatedScore and highScore. }
        sufficientForEstimatedRequirement: { type: boolean, description: Present for increase_weekly_time. False means the supported 2520-minute maximum remains below the truthful requiredWeeklyMinutes. }
        constraintCode: { type: string, nullable: true, enum: [maximum_supported_weekly_time] }
        reasonCode: { type: string, enum: [time_below_estimated_requirement, target_outside_current_forecast, exam_date_reached] }
      additionalProperties: false
    AdaptiveForecast:
      type: object
      description: Active honest estimated range or an action-required expired-date state from adaptive-plan-v1. Required weekly time is the five-minute upward rounding of the exact inverse of the range capacity equation, including uncertainty and its 0.75 effectiveness factor. The active range is explicitly rule-based, not calibrated and never a guaranteed EGE score. An unlikely active forecast always offers a valid target adjustment and offers increase_weekly_time only when it can strictly increase the current time; a learner already at 2520 minutes is never told to increase to the same or a smaller value.
      required: [kind, status, actionCode, currentEstimatedScore, lowScore, highScore, confidence, requiredWeeklyMinutes, availableWeeklyMinutes, weeksRemaining, feasibility, assumptionCodes, choices]
      properties:
        kind: { type: string, enum: [estimated_range, action_required] }
        status: { type: string, enum: [active, exam_date_expired] }
        actionCode: { type: string, nullable: true, enum: [update_exam_date] }
        currentEstimatedScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        lowScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        highScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        confidence: { type: integer, minimum: 0, maximum: 100, nullable: true }
        requiredWeeklyMinutes: { type: integer, minimum: 0, multipleOf: 5, nullable: true }
        availableWeeklyMinutes: { type: integer, minimum: 30, maximum: 2520 }
        weeksRemaining: { type: number, minimum: 0, description: Real fractional weeks for an active goal; exactly zero after the exam date. }
        feasibility: { type: string, enum: [feasible_with_consistent_study, unlikely_with_current_time, update_exam_date_required] }
        assumptionCodes:
          type: array
          items: { type: string, enum: [rule_based_not_calibrated, study_time_completed_as_planned, preliminary_profile, short_deadline, exam_date_reached] }
        choices: { type: array, maxItems: 2, description: Empty when feasible; update-date only when expired; otherwise a target adjustment plus an optional strictly actionable time increase., items: { $ref: '#/components/schemas/AdaptiveForecastChoice' } }
      additionalProperties: false
    AdaptiveAllocationItem:
      type: object
      required: [id, percentage, reasonCodes]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        label: { type: string, minLength: 1, maxLength: 160 }
        module: { type: string, enum: [vocabulary, grammar, reading, listening, writing, speaking] }
        percentage: { type: integer, minimum: 0, maximum: 100 }
        activityType: { type: string, enum: [diagnostic_probe, retention_review, practice] }
        reasonCodes:
          type: array
          minItems: 1
          items: { type: string, enum: [high_uncertainty, due_review, critical_retention_expiry, target_gap, high_ege_impact, deadline_pressure, maintenance] }
      additionalProperties: false
    AdaptivePlan:
      type: object
      required: [id, version, revision, basePlanRevision, goalRevision, taxonomyVersion, profileCalculationRevision, profileEvidenceWatermarkVersion, profileEvidenceObservedAt, profileEvidenceSourceCount, recalculationBucket, calculatedAt, forecast, allocation, stability, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
