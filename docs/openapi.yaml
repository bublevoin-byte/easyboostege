    AdaptiveGoalMutationResponse:
      type: object
      required: [created, replayed, superseded, goal, profile, plan]
      properties:
        created: { type: boolean, description: True only when this request created the goal revision that is still current in this response. }
        replayed: { type: boolean, description: True when the exact retained owner-bound idempotency claim was replayed. }
        superseded: { type: boolean, description: True when the request's saved or replayed goal is older than the authoritative current snapshot returned. }
