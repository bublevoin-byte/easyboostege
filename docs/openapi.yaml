        revision: { type: integer, minimum: 1 }
        basePlanRevision: { type: integer, minimum: 1, nullable: true, description: Exact current plan revision used to calculate this revision; null only for the first plan. }
        goalRevision: { type: integer, minimum: 1 }
        taxonomyVersion: { type: string, enum: [ege-en-v1] }
        profileCalculationRevision: { type: integer, minimum: 1 }
        profileEvidenceWatermarkVersion: { type: string, enum: [adaptive-evidence-watermark-v1] }
        profileEvidenceObservedAt: { type: string, format: date-time, nullable: true }
        profileEvidenceSourceCount: { type: integer, minimum: 0 }
        recalculationBucket: { type: string, format: date }
        calculatedAt: { type: string, format: date-time, description: Deterministic UTC start of recalculationBucket used by every time-dependent plan calculation. }
        forecast: { $ref: '#/components/schemas/AdaptiveForecast' }
        allocation:
          type: object
          required: [modules, skills]
          properties:
            modules: { type: array, minItems: 6, maxItems: 6, items: { $ref: '#/components/schemas/AdaptiveAllocationItem' }, description: Integer percentages total exactly 100. }
            skills: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/AdaptiveAllocationItem' }, description: Integer percentages total exactly 100; high uncertainty creates diagnostic_probe work. }
          additionalProperties: false
        stability:
          type: object
          required: [applied, maximumChangePercentagePoints, bypassReason, bypassedSkillIds, bypassedModuleIds]
          properties:
            applied: { type: boolean }
