            bypassReason: { type: string, nullable: true, enum: [goal_changed, critical_retention_expiry] }
            bypassedSkillIds: { type: array, maxItems: 0, items: { type: string }, description: Reserved and empty until Ticket 06 adds repository-derived persisted critical expiry. }
            bypassedModuleIds: { type: array, maxItems: 0, items: { type: string, enum: [vocabulary, grammar, reading, listening, writing, speaking] }, description: Reserved and empty until Ticket 06 adds repository-derived persisted critical expiry. }
          additionalProperties: false
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      additionalProperties: false
    AdaptiveDiagnosticChoice:
      type: object
