  /api/v1/speaking/full-sessions/{sessionId}/pronunciation-assessment:
    post:
      summary: Assess one recorded response from a submitted full Speaking section
      description: Locked until the whole section is submitted. At response completion the client sends a SHA-256 fingerprint of the canonical PCM16 mono 16 kHz WAV; upload atomically requires the same fingerprint and submitted duration, then pins the first assessment idempotency key to that exact owner, task revision, accent and response position. Ordinary raw audio is never persisted. Tasks 2 and 3 require X-Speaking-Item. Exact replay with the pinned key does not spend quota twice; a fresh key, replacement take or duration mismatch is rejected before provider work.
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-Speech-Locale, required: true, schema: { type: string, enum: [en-GB, en-US] } }
        - { in: header, name: X-Audio-Duration-Seconds, required: true, schema: { type: number, minimum: 1, maximum: 180 } }
        - { in: header, name: X-Speaking-Task, required: true, schema: { type: integer, enum: [1, 2, 3, 4] } }
        - { in: header, name: X-Speaking-Item, required: false, schema: { type: integer, minimum: 1, maximum: 5 } }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary, maxLength: 10485760, x-maxBytes: 10485760 } }
      responses:
        '200': { description: Final normalized assessment, billing settlement and quota, content: { application/json: { schema: { $ref: '#/components/schemas/SpeakingPronunciationAssessment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Full section not found for this learner }
        '409': { description: Full section is not submitted, response was not recorded, accent/catalog differs, or the submitted fingerprint, duration or pinned idempotency key does not match }
        '413': { description: Audio exceeds the configured ceiling }
        '415': { description: Unsupported audio MIME type }
        '429': { description: Monthly provider seconds exhausted }
        '503': { description: Pronunciation provider unavailable }
